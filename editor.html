<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remove image backgrounds privately in your browser.">
  <title>✂️ BG Remover</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0f0f0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f0f0f;color:#f8fafc}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid #292929;background:#0f0f0f}.brand{font-size:clamp(1.05rem,2vw,1.35rem);font-weight:800;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.button{border:1px solid #3a3a3a;border-radius:9px;padding:10px 14px;background:#191919;color:#f8fafc;font:inherit;font-weight:650;cursor:pointer;transition:.2s ease}.button:hover:not(:disabled){border-color:#8b5cf6;background:#242024}.button:disabled{opacity:.45;cursor:not-allowed}.button.primary{background:#8b5cf6;border-color:#8b5cf6;color:#fff}.button.primary:hover:not(:disabled){background:#7c3aed;border-color:#7c3aed}main{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:clamp(24px,5vw,52px) 0}.heading{text-align:center;margin-bottom:24px}.heading h1{margin:0 0 8px;font-size:clamp(1.45rem,4vw,2.1rem)}.heading p,.info{margin:0;color:#a1a1aa}.workspace{display:grid;gap:20px}.canvas-wrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:min(62vh,620px);padding:clamp(12px,3vw,28px);overflow:hidden;border:1px solid #343434;border-radius:16px;background-color:#1f1f1f;background-image:repeating-conic-gradient(#2a2a2a 0 25%,#1f1f1f 0 50%);background-size:40px 40px}.canvas-wrap.dragging{outline:2px solid #8b5cf6;outline-offset:-2px}.canvas-wrap canvas{display:block;max-width:100%;max-height:min(58vh,570px);width:auto;height:auto;object-fit:contain;box-shadow:0 12px 34px #0008}.hidden{display:none!important}.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#d4d4d8;padding:50px 20px}.empty strong{font-size:clamp(1rem,3vw,1.25rem)}.empty span{color:#a1a1aa}.upload-link{color:#a78bfa!important;cursor:pointer;text-decoration:underline}.panel{padding:clamp(18px,3vw,28px);border:1px solid #292929;border-radius:16px;background:#151515}.panel h2{margin:0 0 16px;font-size:1.15rem}.remove-wrap{text-align:center}.remove-wrap .button{width:100%;font-size:1.05rem;padding:14px}.processing{text-align:center;color:#c4b5fd;margin-top:14px}.spinner{display:inline-block;width:14px;height:14px;margin-right:7px;border:2px solid #6d28d9;border-top-color:#ddd6fe;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-controls{margin-top:18px}.toggle{display:flex;gap:8px;margin-bottom:18px}.toggle button{flex:1;border:1px solid #3a3a3a;border-radius:8px;padding:10px;background:#191919;color:#d4d4d8;font:inherit;cursor:pointer}.toggle button.active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}.control{margin:14px 0}.control-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#d4d4d8}.control-row output{color:#c4b5fd}.control input{width:100%;accent-color:#8b5cf6}.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.result-actions .button{flex:1}.info{text-align:center;font-size:.85rem;margin-top:20px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%;justify-content:stretch}.top-actions .button{flex:1;padding:9px 8px;font-size:.88rem}.canvas-wrap{min-height:45vh}.result-actions{flex-direction:column}}
  </style>
  <script type="module">
    import {removeBackground} from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';
    window.imglyRemoveBackground = removeBackground;
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">✂️ BG Remover</div>
    <div class="top-actions"><button class="button" id="resetButton">Reset</button><button class="button" id="topDownload" disabled>Download PNG</button><button class="button" id="uploadButton">Upload</button><input id="imageInput" type="file" accept="image/*" hidden></div>
  </header>
  <main>
    <div class="heading"><h1>Remove background</h1><p>Fast, private background removal right in your browser.</p></div>
    <section class="workspace">
      <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" class="hidden"></canvas><div class="empty" id="empty"><strong>Drop image here, click Upload, or paste (Ctrl+V)</strong><span>JPG, PNG, or WebP</span><span class="upload-link" id="emptyUpload">Choose an image</span></div></div>
      <section class="panel"><h2>Background Removal</h2><div class="remove-wrap"><button class="button primary" id="removeButton" disabled>✨ Remove Background</button></div><div class="processing hidden" id="processing"><span class="spinner"></span>Removing background…</div><div class="result-controls hidden" id="resultControls"><div class="toggle"><button id="originalToggle">Original</button><button id="transparentToggle" class="active">Transparent</button></div><div class="control"><div class="control-row"><label for="edgeSmooth">Edge Smooth</label><output id="edgeValue">0</output></div><input id="edgeSmooth" type="range" min="0" max="10" value="0"></div><div class="result-actions"><button class="button" id="restoreButton">Restore</button><button class="button primary" id="downloadButton">Download Transparent PNG</button></div></div><p class="info">100% private — runs in your browser, no upload to server</p></section>
    </section>
  </main>
  <script>
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),wrap=document.getElementById('canvasWrap'),empty=document.getElementById('empty'),input=document.getElementById('imageInput'),removeButton=document.getElementById('removeButton'),processing=document.getElementById('processing'),controls=document.getElementById('resultControls'),topDownload=document.getElementById('topDownload'),downloadButton=document.getElementById('downloadButton'),edgeSmooth=document.getElementById('edgeSmooth'),edgeValue=document.getElementById('edgeValue');
    let uploadedImage=null,bgRemovedImage=null,originalData=null,transparentData=null,showOriginal=false,isLoading=false;
    function renderImage(image=showOriginal||!bgRemovedImage?uploadedImage:bgRemovedImage){if(!image)return;ctx.clearRect(0,0,canvas.width,canvas.height);const scale=Math.min(canvas.width/image.naturalWidth||canvas.width/image.width,canvas.height/image.naturalHeight||canvas.height/image.height),w=image.width*scale,h=image.height*scale;ctx.drawImage(image,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
    function imageFromBlob(blob){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{URL.revokeObjectURL(image.src);resolve(image)};image.onerror=reject;image.src=URL.createObjectURL(blob)})}
    function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const image=new Image();image.onload=()=>{uploadedImage=image;bgRemovedImage=null;originalData=null;transparentData=null;showOriginal=false;canvas.width=img.width;canvas.height=img.height;renderImage();canvas.classList.remove('hidden');empty.classList.add('hidden');removeButton.disabled=false;topDownload.disabled=true;controls.classList.add('hidden');URL.revokeObjectURL(image.src)};image.src=URL.createObjectURL(file)}
    async function fallbackRemove(){const data=ctx.getImageData(0,0,canvas.width,canvas.height),d=data.data;let r=0,g=0,b=0,n=0;for(let y=0;y<Math.min(10,canvas.height);y++)for(let x=0;x<Math.min(10,canvas.width);x++){const i=(y*canvas.width+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++}r/=n;g/=n;b/=n;const threshold=40;for(let i=0;i<d.length;i+=4){const distance=Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b);if(distance<threshold)d[i+3]=0;else if(distance<threshold+25)d[i+3]=Math.round(d[i+3]*(distance-threshold)/25)}ctx.putImageData(data,0,0);return imageFromBlob(await new Promise(resolve=>canvas.toBlob(resolve,'image/png')))}
    async function removeBackground(){if(!uploadedImage||isLoading)return;isLoading=true;removeButton.disabled=true;processing.classList.remove('hidden');try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));let result;if(window.imglyRemoveBackground)result=await window.imglyRemoveBackground(blob);else throw new Error('CDN unavailable');bgRemovedImage=await imageFromBlob(result)}catch(error){console.warn('Using local fallback:',error);bgRemovedImage=await fallbackRemove()}originalData=canvas.toDataURL('image/png');showOriginal=false;renderImage();transparentData=canvas.toDataURL('image/png');controls.classList.remove('hidden');topDownload.disabled=false}catch(error){console.error(error);alert('Could not remove the background. Please try another image.')}finally{isLoading=false;removeButton.disabled=false;processing.classList.add('hidden')}}
    function download(){if(!bgRemovedImage)return;showOriginal=false;renderImage();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`removed-bg-${Date.now()}.png`;a.click()}
    function reset(){uploadedImage=bgRemovedImage=originalData=transparentData=null;ctx.clearRect(0,0,canvas.width,canvas.height);canvas.classList.add('hidden');empty.classList.remove('hidden');removeButton.disabled=true;topDownload.disabled=true;controls.classList.add('hidden');input.value=''}
    document.getElementById('uploadButton').onclick=()=>input.click();document.getElementById('emptyUpload').onclick=()=>input.click();input.onchange=e=>loadFile(e.target.files[0]);removeButton.onclick=removeBackground;topDownload.onclick=download;downloadButton.onclick=download;document.getElementById('resetButton').onclick=reset;document.getElementById('originalToggle').onclick=()=>{showOriginal=true;renderImage();document.getElementById('originalToggle').classList.add('active');document.getElementById('transparentToggle').classList.remove('active')};document.getElementById('transparentToggle').onclick=()=>{showOriginal=false;renderImage();document.getElementById('transparentToggle').classList.add('active');document.getElementById('originalToggle').classList.remove('active')};document.getElementById('restoreButton').onclick=()=>{showOriginal=true;renderImage()};edgeSmooth.oninput=()=>{edgeValue.value=edgeSmooth.value};window.addEventListener('dragover',e=>{e.preventDefault();wrap.classList.add('dragging')});window.addEventListener('drop',e=>{e.preventDefault();wrap.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});window.addEventListener('dragleave',()=>wrap.classList.remove('dragging'));document.addEventListener('paste',e=>loadFile([...e.clipboardData.files].find(file=>file.type.startsWith('image/'))));
  </script>
</body>
</html>
