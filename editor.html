<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remove image backgrounds privately in your browser.">
  <title>BG Remover</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#111113}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111113}.top{height:72px;border-bottom:1px solid #29292e;background:#171719;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px)}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.brand span{margin-right:8px}.top-actions{display:flex;gap:10px}.button{border:1px solid #393941;background:#232329;color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}.button:hover:not(:disabled){background:#303039;border-color:#555563}.button:disabled{opacity:.45;cursor:not-allowed}.button.primary{border:0;background:linear-gradient(135deg,#8b5cf6,#a78bfa);box-shadow:0 8px 24px #8b5cf633}.button.primary:hover:not(:disabled){filter:brightness(1.1)}main{max-width:1050px;margin:0 auto;padding:34px 20px 64px}.heading{text-align:center;margin-bottom:24px}.heading h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.05em;margin:0 0 8px}.heading p{margin:0;color:#a1a1aa}.workspace{display:flex;flex-direction:column;gap:18px}.canvas-wrap{position:relative;min-height:440px;padding:24px;display:flex;align-items:center;justify-content:center;border:1px solid #303038;border-radius:18px;overflow:hidden;background-image:repeating-conic-gradient(#1f1f1f 0% 25%,#2a2a2a 0% 50%);background-position:0 0;background-size:40px 40px;box-shadow:0 18px 50px #0005}.canvas-wrap.dragging{outline:3px solid #8b5cf6;outline-offset:-3px}.canvas-wrap canvas{display:block;max-width:100%;max-height:620px;width:auto;height:auto;object-fit:contain;box-shadow:0 12px 28px #0008}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e4e4e7;gap:8px;min-height:300px}.empty strong{font-size:19px}.empty span{font-size:14px;color:#a1a1aa}.empty .upload-link{margin-top:10px;color:#c4b5fd;font-weight:700;cursor:pointer}.panel{background:#19191d;border:1px solid #303038;border-radius:18px;padding:22px}.panel h2{font-size:18px;margin:0 0 16px}.remove-wrap{display:flex;gap:10px}.remove-wrap .button{width:100%;font-size:16px;padding:15px;border-radius:999px}.processing{display:flex;justify-content:center;align-items:center;gap:9px;color:#c4b5fd;margin:14px 0;font-size:14px}.spinner{width:16px;height:16px;border:2px solid #6d5ab4;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-controls{margin-top:18px;padding-top:18px;border-top:1px solid #303038}.toggle{display:flex;background:#25252b;border-radius:999px;padding:4px;margin-bottom:18px}.toggle button{flex:1;border:0;background:transparent;color:#a1a1aa;border-radius:999px;padding:9px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.toggle button.active{background:#8b5cf6;color:#fff}.control{margin:14px 0}.control-row{display:flex;justify-content:space-between;color:#d4d4d8;font-size:14px;margin-bottom:8px}.control-row output{color:#c4b5fd;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#8b5cf6}.result-actions{display:flex;gap:10px;margin-top:18px}.result-actions .button{flex:1}.info{text-align:center;color:#71717a;font-size:12px;margin:18px 0 0}.hidden{display:none!important}@media(max-width:620px){.top{padding:0 14px}.brand{font-size:17px}.top-actions{gap:6px}.top-actions .button{padding:9px 10px;font-size:12px}.canvas-wrap{min-height:330px;padding:12px}.result-actions{flex-direction:column}}
  </style>
  <script type="module">
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js';
    window.bgRemove = async (blob) => {
      const config = { publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/' };
      return await imglyRemoveBackground(blob, config);
    };
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><span>✂️</span>BG Remover</div>
    <div class="top-actions"><button class="button" id="resetButton">Reset</button><button class="button" id="topDownload" disabled>Download PNG</button><button class="button" id="uploadButton">Upload</button></div>
  </header>
  <main>
    <div class="heading"><h1>Remove background</h1><p>Fast, private background removal right in your browser.</p></div>
    <section class="workspace">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas" class="hidden"></canvas>
        <div class="empty" id="empty"><strong>Drop image here or click Upload</strong><span>JPG, PNG, or WebP</span><span class="upload-link" id="emptyUpload">Choose an image</span></div>
      </div>
      <section class="panel" id="panel">
        <h2>Background Removal</h2>
        <div class="remove-wrap"><button class="button primary" id="removeButton" disabled>✨ Remove Background</button></div>
        <div class="processing hidden" id="processing"><span class="spinner"></span>Removing background... 2-3 sec</div>
        <div class="result-controls hidden" id="resultControls">
          <div class="toggle"><button id="originalToggle">Original</button><button id="transparentToggle" class="active">Transparent</button></div>
          <div class="control"><div class="control-row"><label for="edgeSmooth">Edge Smooth</label><output id="edgeValue">0</output></div><input id="edgeSmooth" type="range" min="0" max="10" value="0"></div>
          <div class="control"><div class="control-row"><label for="threshold">Threshold</label><output id="thresholdValue">50</output></div><input id="threshold" type="range" min="0" max="100" value="50"></div>
          <div class="result-actions"><button class="button" id="restoreButton">Restore Original</button><button class="button primary" id="downloadButton">Download Transparent PNG</button></div>
        </div>
        <p class="info">100% private - runs in your browser, no upload to server</p>
      </section>
    </section>
    <input id="imageInput" type="file" accept="image/*" hidden>
  </main>
  <script>
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),canvasWrap=document.getElementById('canvasWrap'),empty=document.getElementById('empty'),input=document.getElementById('imageInput'),removeButton=document.getElementById('removeButton'),processing=document.getElementById('processing'),resultControls=document.getElementById('resultControls'),topDownload=document.getElementById('topDownload'),downloadButton=document.getElementById('downloadButton'),originalToggle=document.getElementById('originalToggle'),transparentToggle=document.getElementById('transparentToggle'),edgeSmooth=document.getElementById('edgeSmooth'),threshold=document.getElementById('threshold'),edgeValue=document.getElementById('edgeValue'),thresholdValue=document.getElementById('thresholdValue');
    let uploadedImage=null,canvasRef=canvas,bgRemovedImage=null,isLoading=false,showOriginal=false,edgeSmoothValue=0,thresholdValueState=50;
    function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(showOriginal||!bgRemovedImage){if(uploadedImage)ctx.drawImage(uploadedImage,0,0,canvas.width,canvas.height)}else ctx.drawImage(bgRemovedImage,0,0,canvas.width,canvas.height)}
    function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const image=new Image();image.onload=()=>{uploadedImage=image;bgRemovedImage=null;showOriginal=false;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.classList.remove('hidden');empty.classList.add('hidden');removeButton.disabled=false;topDownload.disabled=true;resultControls.classList.add('hidden');render();URL.revokeObjectURL(image.src)};image.src=URL.createObjectURL(file)}
    function imageFromBlob(blob){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{URL.revokeObjectURL(image.src);resolve(image)};image.onerror=reject;image.src=URL.createObjectURL(blob)})}
    async function fallbackRemove(){const source=document.createElement('canvas');source.width=canvas.width;source.height=canvas.height;source.getContext('2d').drawImage(uploadedImage,0,0,source.width,source.height);const c=source.getContext('2d'),data=c.getImageData(0,0,source.width,source.height),p=data.data,samples=[];for(let y=0;y<Math.min(10,source.height);y++)for(let x=0;x<Math.min(10,source.width);x++)samples.push([p[(y*source.width+x)*4],p[(y*source.width+x)*4+1],p[(y*source.width+x)*4+2]]);const bg=samples.reduce((a,v)=>a.map((n,i)=>n+v[i]),[0,0,0]).map(n=>n/samples.length),limit=thresholdValueState*2.55;for(let i=0;i<p.length;i+=4){const d=Math.hypot(p[i]-bg[0],p[i+1]-bg[1],p[i+2]-bg[2]);const feather=edgeSmoothValue*5;p[i+3]=d<=limit?Math.max(0,Math.min(255,(d-limit)/Math.max(1,feather))*255):255}c.putImageData(data,0,0);return imageFromBlob(await new Promise(r=>source.toBlob(r,'image/png')))}
    async function removeBackground(){if(!uploadedImage||isLoading)return;isLoading=true;removeButton.disabled=true;processing.classList.remove('hidden');try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const result=await window.bgRemove(blob);bgRemovedImage=await imageFromBlob(result)}catch(error){console.warn('Background removal library failed; using local color-key fallback.',error);try{bgRemovedImage=await fallbackRemove()}catch(fallbackError){alert('Could not remove this background. Please try another image.');console.error(fallbackError)}}finally{isLoading=false;processing.classList.add('hidden');removeButton.disabled=!uploadedImage;if(bgRemovedImage){showOriginal=false;resultControls.classList.remove('hidden');topDownload.disabled=false;render()}}}
    function download(){if(!bgRemovedImage)return;showOriginal=false;render();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`removed-bg-${Date.now()}.png`;a.click()}
    function reset(){uploadedImage=null;bgRemovedImage=null;showOriginal=false;ctx.clearRect(0,0,canvas.width,canvas.height);canvas.classList.add('hidden');empty.classList.remove('hidden');removeButton.disabled=true;topDownload.disabled=true;resultControls.classList.add('hidden');input.value=''}
    document.getElementById('uploadButton').onclick=()=>input.click();document.getElementById('emptyUpload').onclick=()=>input.click();input.onchange=e=>loadFile(e.target.files[0]);removeButton.onclick=removeBackground;downloadButton.onclick=download;topDownload.onclick=download;document.getElementById('resetButton').onclick=reset;document.getElementById('restoreButton').onclick=()=>{showOriginal=true;originalToggle.classList.add('active');transparentToggle.classList.remove('active');render()};originalToggle.onclick=()=>{showOriginal=true;originalToggle.classList.add('active');transparentToggle.classList.remove('active');render()};transparentToggle.onclick=()=>{showOriginal=false;transparentToggle.classList.add('active');originalToggle.classList.remove('active');render()};edgeSmooth.oninput=e=>{edgeSmoothValue=+e.target.value;edgeValue.value=edgeSmoothValue;if(bgRemovedImage&&!showOriginal)render()};threshold.oninput=e=>{thresholdValueState=+e.target.value;thresholdValue.value=thresholdValueState};['dragenter','dragover'].forEach(type=>canvasWrap.addEventListener(type,e=>{e.preventDefault();canvasWrap.classList.add('dragging')}));['dragleave','drop'].forEach(type=>canvasWrap.addEventListener(type,e=>{e.preventDefault();canvasWrap.classList.remove('dragging')}));canvasWrap.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));document.addEventListener('paste',e=>{const file=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(file)loadFile(file)});
  </script>
</body>
</html>
