<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Photo Editor</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#1b1e25; --panel-2:#242832; --text:#f6f7fb; --muted:#9da4b4; --accent:#9e8cff; --accent-2:#c1b7ff; --border:rgba(255,255,255,.1); --shadow:0 24px 70px rgba(0,0,0,.35); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -20%,#2a2a43 0,var(--bg) 44%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .app { min-height:100vh; display:flex; flex-direction:column; }
    .topbar { height:72px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:rgba(17,19,24,.72); backdrop-filter:blur(18px); }
    .brand { display:flex; gap:12px; align-items:center; font-weight:760; letter-spacing:-.03em; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#a694ff,#6154d7); box-shadow:0 8px 24px rgba(126,103,255,.3); }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .button { border:1px solid var(--border); color:var(--text); background:var(--panel-2); border-radius:10px; padding:10px 15px; transition:.2s ease; }
    .button:hover { border-color:rgba(193,183,255,.6); transform:translateY(-1px); }
    .button.primary { border:0; color:#171328; background:var(--accent-2); font-weight:750; }
    .workspace { flex:1; min-height:0; display:flex; flex-direction:column; }
    .canvas-area { position:relative; flex:1; min-height:420px; display:flex; align-items:center; justify-content:center; padding:32px; overflow:hidden; }
    .canvas-wrap { position:relative; max-width:min(86vw,980px); max-height:min(64vh,670px); display:flex; align-items:center; justify-content:center; border-radius:5px; box-shadow:var(--shadow); overflow:hidden; background:#fff; background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
    #editorCanvas { display:block; max-width:100%; max-height:100%; width:auto; height:auto; touch-action:none; }
    .empty-state { text-align:center; color:var(--muted); padding:25px; } .empty-state strong { display:block; color:var(--text); font-size:18px; margin-bottom:6px; }
    .drop-hint { position:absolute; inset:16px; border:1px dashed rgba(193,183,255,.45); border-radius:13px; display:none; align-items:center; justify-content:center; color:var(--accent-2); background:rgba(30,27,55,.35); }
    .canvas-area.dragging .drop-hint { display:flex; }
    .add-sheet { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(390px,calc(100% - 36px)); padding:27px; border:1px solid var(--border); border-radius:22px; text-align:center; background:rgba(27,30,37,.92); box-shadow:var(--shadow); }
    .add-sheet h1 { font-size:23px; margin:0 0 7px; letter-spacing:-.04em; } .add-sheet p { margin:0 0 22px; color:var(--muted); line-height:1.5; }
    .upload-button { display:inline-flex; align-items:center; gap:9px; padding:12px 18px; border-radius:11px; color:#171328; font-weight:750; background:var(--accent-2); cursor:pointer; } .add-sheet.hidden { display:none; }
    .editor-panel { width:100%; border-top:1px solid var(--border); background:rgba(25,28,35,.95); backdrop-filter:blur(20px); }
    .panel-content { max-height:0; overflow:hidden; transition:max-height .3s ease; } .panel-content.open { max-height:280px; overflow:auto; }
    .filter-panel { padding:18px 24px 16px; } .panel-header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:14px; }
    .panel-title { font-weight:750; } .filter-controls { display:flex; align-items:center; gap:16px; } .range-wrap { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
    input[type=range] { accent-color:var(--accent); width:180px; } .filter-actions { display:flex; gap:8px; } .filter-actions .cancel { color:var(--text); background:#3b3f49; } .filter-actions .apply { border:0; color:#fff; background:#765ce6; font-weight:750; }
    .filter-list { display:flex; gap:14px; overflow-x:auto; padding:2px 2px 7px; } .filter-option { flex:0 0 80px; border:0; background:transparent; color:var(--muted); padding:0; text-align:center; }
    .filter-option.active { color:var(--text); } .thumb { display:block; width:76px; height:58px; object-fit:cover; border-radius:9px; border:2px solid transparent; background:#30343f; margin-bottom:7px; } .filter-option.active .thumb { border-color:var(--accent-2); box-shadow:0 0 0 2px rgba(158,140,255,.2); }
    .filter-option span { font-size:12px; white-space:nowrap; } .toolbar { height:94px; display:flex; align-items:center; justify-content:center; border-top:1px solid var(--border); background:#191c23; }
    .tools { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; max-width:700px; } .tool { min-width:82px; color:var(--muted); border:0; background:transparent; padding:12px 9px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:7px; transition:.2s; } .tool:hover,.tool.active { color:var(--text); background:var(--panel-2); } .tool.active svg { color:var(--accent-2); } .tool svg { width:21px; height:21px; }
    .toast { position:fixed; left:50%; bottom:112px; transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:11px 16px; border-radius:10px; background:#f6f7fb; color:#171820; transition:.2s; } .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:650px) { .topbar { height:62px; padding:0 15px; } .top-actions .button:first-child { display:none; } .canvas-area { min-height:350px; padding:16px; } .toolbar { height:80px; overflow-x:auto; justify-content:flex-start; } .tools { min-width:600px; } .tool { min-width:72px; font-size:12px; } .filter-panel { padding:15px; } .panel-header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Canvas Editor</span></div><div class="top-actions"><button class="button" id="resetButton" type="button">Reset</button><button class="button primary" id="downloadButton" type="button" disabled>Download PNG</button></div></header>
    <section class="workspace"><div class="canvas-area" id="canvasArea"><div class="canvas-wrap" id="canvasWrap"><canvas id="editorCanvas" aria-label="Photo editing canvas"></canvas><div class="empty-state" id="emptyState"><strong>Your canvas is ready</strong><span>Upload an image to start editing</span></div></div><div class="drop-hint">Drop image here</div><div class="add-sheet" id="addImageSheet"><h1>Add an image</h1><p>Choose a photo or drag and drop one onto the canvas to begin.</p><label class="upload-button" for="fileInput">＋ Choose image</label><input id="fileInput" type="file" accept="image/*" hidden /></div></div>
      <section class="editor-panel"><div class="panel-content" id="panelContent"><div class="filter-panel" id="filtersPanel"><div class="panel-header"><div class="panel-title">Filters</div><div class="filter-actions"><button class="button cancel" id="cancelFilterButton" type="button">Cancel</button><button class="button apply" id="applyFilterButton" type="button">Apply</button></div></div><div class="filter-controls"><label class="range-wrap" for="intensity"><span>Intensity</span><input id="intensity" type="range" min="0" max="100" value="100" /><b id="intensityValue">100%</b></label></div><div class="filter-list" id="filterList" role="listbox" aria-label="Filters"></div></div></div>
        <nav class="toolbar" aria-label="Editing tools"><div class="tools"><button class="tool active" data-tool="filters" type="button"><span>☷</span><span>Filters</span></button><button class="tool" data-tool="adjust" type="button"><span>☰</span><span>Adjust</span></button><button class="tool" data-tool="crop" type="button"><span>⌗</span><span>Crop</span></button><button class="tool" data-tool="text" type="button"><span>T</span><span>Text</span></button><button class="tool" data-tool="draw" type="button"><span>✎</span><span>Draw</span></button><button class="tool" data-tool="stickers" type="button"><span>○</span><span>Stickers</span></button></div></nav>
      </section></section><div class="toast" id="toast" role="status"></div>
  </main>
  <script>
    const state = { uploadedImage:null, canvasRef:document.getElementById('editorCanvas'), isImageLoaded:false };
    const canvas=state.canvasRef, ctx=canvas.getContext('2d',{willReadFrequently:true});
    const canvasArea=document.getElementById('canvasArea'), canvasWrap=document.getElementById('canvasWrap'), emptyState=document.getElementById('emptyState'), sheet=document.getElementById('addImageSheet'), fileInput=document.getElementById('fileInput'), panelContent=document.getElementById('panelContent'), filterList=document.getElementById('filterList'), intensity=document.getElementById('intensity'), intensityValue=document.getElementById('intensityValue'), toast=document.getElementById('toast'), downloadButton=document.getElementById('downloadButton');
    const filters=['Original','Grayscale','Sepia','Vintage','B&W','Vibrant','Cool','Warm','Dramatic'];
    let selectedFilter='Original', sourcePixels=null, tempFilteredImage=null, committedImage=null, history=[], toastTimer;
    function showToast(message){ toast.textContent=message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2200); }
    function clamp(value){return Math.max(0,Math.min(255,value));} function mix(original,filtered,amount){return original+(filtered-original)*amount;}
    function transformPixel(r,g,b,filter){const gray=.299*r+.587*g+.114*b; switch(filter){case'Grayscale':return[gray,gray,gray];case'Sepia':return[r*.393+g*.769+b*.189,r*.349+g*.686+b*.168,r*.272+g*.534+b*.131];case'Vintage':return[r*1.12+18,g*.96+6,b*.76-2];case'B&W':{const bw=gray>138?255:0;return[bw,bw,bw];}case'Vibrant':{const avg=(r+g+b)/3;return[avg+(r-avg)*1.45,avg+(g-avg)*1.45,avg+(b-avg)*1.45];}case'Cool':return[r*.92,g*1.02+3,b*1.16+8];case'Warm':return[r*1.15+7,g*1.02+2,b*.86];case'Dramatic':{const contrast=1.32;return[(r-128)*contrast+128,(g-128)*contrast+128,(b-128)*contrast+128];}default:return[r,g,b];}}
    function filteredPixels(pixels,filter,amount){const output=new Uint8ClampedArray(pixels);for(let i=0;i<output.length;i+=4){const[r,g,b]=transformPixel(pixels[i],pixels[i+1],pixels[i+2],filter);output[i]=clamp(mix(pixels[i],r,amount));output[i+1]=clamp(mix(pixels[i+1],g,amount));output[i+2]=clamp(mix(pixels[i+2],b,amount));}return output;}
    function makePreviewPixels(){return filteredPixels(sourcePixels.data,selectedFilter,Number(intensity.value)/100);}
    function renderPreview(){if(!sourcePixels)return;tempFilteredImage=new ImageData(makePreviewPixels(),sourcePixels.width,sourcePixels.height);ctx.putImageData(tempFilteredImage,0,0);}
    function renderCommitted(){if(committedImage)ctx.putImageData(committedImage,0,0);}
    function createFilterPreviews(){filterList.replaceChildren();filters.forEach(name=>{const button=document.createElement('button');button.className='filter-option';button.type='button';button.dataset.filter=name;const preview=document.createElement('canvas');preview.className='thumb';preview.width=152;preview.height=116;button.append(preview,Object.assign(document.createElement('span'),{textContent:name}));button.addEventListener('click',()=>{selectedFilter=name;document.querySelectorAll('.filter-option').forEach(el=>el.classList.toggle('active',el===button));renderPreview();});filterList.append(button);if(sourcePixels){const previewCtx=preview.getContext('2d'),scale=Math.min(preview.width/canvas.width,preview.height/canvas.height),w=Math.max(1,Math.round(canvas.width*scale)),h=Math.max(1,Math.round(canvas.height*scale)),temp=document.createElement('canvas');temp.width=sourcePixels.width;temp.height=sourcePixels.height;temp.getContext('2d').putImageData(new ImageData(filteredPixels(sourcePixels.data,name,1),sourcePixels.width,sourcePixels.height),0,0);previewCtx.drawImage(temp,(preview.width-w)/2,(preview.height-h)/2,w,h);}button.classList.toggle('active',name===selectedFilter);});}
    function openFilters(){panelContent.classList.add('open');document.querySelector('.toolbar').style.display='none';if(sourcePixels){tempFilteredImage=null;renderPreview();}}
    function closeFilters(){panelContent.classList.remove('open');document.querySelector('.toolbar').style.display='flex';}
    function loadFile(file){if(!file||!file.type.startsWith('image/')){showToast('Please choose an image file.');return;}const reader=new FileReader();reader.onload=event=>{const image=new Image();image.onload=()=>{state.uploadedImage=image;state.isImageLoaded=true;const maxSize=2400,scale=Math.min(1,maxSize/Math.max(image.naturalWidth,image.naturalHeight));canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);sourcePixels=ctx.getImageData(0,0,canvas.width,canvas.height);committedImage=new ImageData(new Uint8ClampedArray(sourcePixels.data),sourcePixels.width,sourcePixels.height);history=[committedImage];emptyState.style.display='none';sheet.classList.add('hidden');canvasWrap.style.aspectRatio=`${canvas.width}/${canvas.height}`;panelContent.classList.add('open');createFilterPreviews();renderPreview();showToast('Image loaded');};image.src=event.target.result;};reader.readAsDataURL(file);}
    fileInput.addEventListener('change',event=>loadFile(event.target.files[0]));['dragenter','dragover'].forEach(type=>canvasArea.addEventListener(type,event=>{event.preventDefault();canvasArea.classList.add('dragging');}));['dragleave','drop'].forEach(type=>canvasArea.addEventListener(type,event=>{event.preventDefault();canvasArea.classList.remove('dragging');}));canvasArea.addEventListener('drop',event=>loadFile(event.dataTransfer.files[0]));
    intensity.addEventListener('input',()=>{intensityValue.textContent=`${intensity.value}%`;renderPreview();});
    document.getElementById('applyFilterButton').addEventListener('click',()=>{if(!state.isImageLoaded)return;tempFilteredImage=tempFilteredImage||new ImageData(makePreviewPixels(),sourcePixels.width,sourcePixels.height);committedImage=new ImageData(new Uint8ClampedArray(tempFilteredImage.data),tempFilteredImage.width,tempFilteredImage.height);history.push(committedImage);renderCommitted();downloadButton.disabled=false;closeFilters();showToast('Filter applied');});
    document.getElementById('cancelFilterButton').addEventListener('click',()=>{if(!state.isImageLoaded)return;selectedFilter='Original';intensity.value=100;intensityValue.textContent='100%';renderCommitted();createFilterPreviews();closeFilters();});
    document.querySelectorAll('.tool').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tool').forEach(tool=>tool.classList.remove('active'));button.classList.add('active');if(button.dataset.tool==='filters')openFilters();else{closeFilters();showToast(`${button.textContent.trim()} tool selected`);}}));
    downloadButton.addEventListener('click',()=>{if(!state.isImageLoaded||downloadButton.disabled)return;const link=document.createElement('a');link.download='edited-photo.png';link.href=canvas.toDataURL('image/png');link.click();});
    document.getElementById('resetButton').addEventListener('click',()=>{if(!state.isImageLoaded)return;selectedFilter='Original';intensity.value=100;intensityValue.textContent='100%';committedImage=new ImageData(new Uint8ClampedArray(sourcePixels.data),sourcePixels.width,sourcePixels.height);history=[committedImage];renderCommitted();downloadButton.disabled=true;createFilterPreviews();showToast('Edits reset');});
    createFilterPreviews();
  </script>
</body>
</html>
