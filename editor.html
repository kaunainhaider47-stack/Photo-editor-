<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="EditKaro canvas-based online photo editor">
  <title>EditKaro Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink: '#08090d', panel: '#11131a', line: '#252936', violet: '#8b5cf6' },
        boxShadow: { panel: '0 18px 60px rgba(0,0,0,.32)' }
      }}
    };
  </script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #3f4655 transparent; }
    html, body { min-height: 100%; background: #08090d; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .glass { background: rgba(17,19,26,.86); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(18px); }
    .tool.active { color: #fff; background: rgba(139,92,246,.2); border-color: rgba(167,139,250,.45); }
    .tool.active svg { color: #c4b5fd; }
    .filter.active { border-color: #a78bfa; background: rgba(139,92,246,.2); }
    .checker { background-color: #1a1d26; background-image: linear-gradient(45deg,#242936 25%,transparent 25%),linear-gradient(-45deg,#242936 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#242936 75%),linear-gradient(-45deg,transparent 75%,#242936 75%); background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; }
    input[type=range] { accent-color: #a78bfa; }
    .drop-active { border-color: #a78bfa !important; background: rgba(139,92,246,.12); }
    @media (max-width: 767px) { #controls { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 72vh; border-radius: 24px 24px 0 0; transform: translateY(calc(100% - 72px)); transition: transform .25s ease; } #controls.open { transform: translateY(0); } #controls .mobile-handle { display: flex; } }
    @media (min-width: 768px) { #controls .mobile-handle { display: none; } }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden text-slate-100">
  <header class="glass sticky top-0 z-30 flex h-16 items-center justify-between px-4 shadow-panel md:px-6">
    <a href="index.html" class="flex items-center gap-2.5 font-bold tracking-tight"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-pink-500">✦</span><span class="text-lg">EditKaro</span><span class="hidden rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2 py-0.5 text-[10px] font-medium text-emerald-300 sm:inline">Canvas editor</span></a>
    <div class="flex items-center gap-2"><button id="undoBtn" title="Undo" class="rounded-lg border border-white/10 px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40">↶ <span class="hidden sm:inline">Undo</span></button><button id="redoBtn" title="Redo" class="rounded-lg border border-white/10 px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-40">↷ <span class="hidden sm:inline">Redo</span></button><button id="downloadBtn" class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-900 transition hover:bg-violet-100">Download</button></div>
  </header>

  <main class="mx-auto grid min-h-[calc(100vh-4rem)] max-w-[1600px] md:grid-cols-[80px_minmax(0,1fr)_320px]">
    <aside class="glass order-2 flex justify-around gap-1 border-x-0 p-2 md:order-1 md:flex-col md:justify-start md:gap-2 md:border-y-0 md:border-l-0 md:p-3">
      <button class="tool active flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="image"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L7 20"/></svg>Image</button>
      <button class="tool flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="filters"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters</button>
      <button class="tool flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="adjust"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4M16 10v4M10 16v4"/></svg>Adjust</button>
      <button class="tool flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="crop"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M6 3v15a3 3 0 0 0 3 3h12M3 6h15a3 3 0 0 1 3 3v12"/></svg>Crop</button>
      <button class="tool flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="text"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg>Text</button>
      <button class="tool flex flex-1 flex-col items-center gap-1 rounded-xl border border-transparent p-2 text-[10px] text-slate-400 transition hover:bg-white/10 md:flex-none" data-tool="bg"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 15.5 7-7M9 9h.01M15 15h.01"/></svg>BG Remover</button>
    </aside>

    <section id="workspace" class="order-1 flex min-h-[calc(100vh-8.5rem)] flex-col p-3 pb-5 sm:p-5 md:order-2 md:min-h-0 md:p-6">
      <div class="mb-3 flex items-center justify-between"><div><p class="text-sm font-semibold text-white">Untitled design</p><p id="status" class="text-xs text-slate-500">Ready to create</p></div><button id="newBtn" class="rounded-lg border border-white/10 px-3 py-2 text-xs text-slate-300 hover:bg-white/10">New image</button></div>
      <div id="dropZone" class="checker relative flex min-h-[55vh] flex-1 items-center justify-center overflow-hidden rounded-2xl border border-dashed border-white/10 p-3 transition md:min-h-0">
        <div id="emptyState" class="z-10 max-w-sm text-center"><div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-violet-500/15 text-3xl text-violet-300">✦</div><h1 class="text-xl font-semibold">Drop an image to start</h1><p class="mt-2 text-sm text-slate-400">Use a JPG, PNG, or WebP. Everything stays in your browser.</p><label for="fileInput" class="mt-5 inline-flex cursor-pointer rounded-xl bg-white px-5 py-3 text-sm font-semibold text-slate-900 hover:bg-violet-100">Choose image</label><input id="fileInput" type="file" accept="image/*" class="hidden"></div>
        <canvas id="canvas" class="hidden max-h-[68vh] max-w-full rounded-lg shadow-2xl"></canvas>
      </div>
      <div class="mt-3 flex items-center justify-between text-xs text-slate-500"><span id="imageInfo">No image loaded</span><button id="fitBtn" class="hidden rounded-lg border border-white/10 px-3 py-1.5 hover:bg-white/10">Fit canvas</button></div>
    </section>

    <aside id="controls" class="glass order-3 overflow-y-auto p-5 shadow-panel md:rounded-none md:border-y-0 md:border-r-0">
      <div class="mobile-handle mb-4 cursor-pointer flex-col items-center" id="sheetHandle"><span class="mb-2 h-1 w-12 rounded-full bg-slate-600"></span><span class="text-xs text-slate-400">Swipe or tap to close</span></div>
      <div class="mb-6 flex items-start justify-between"><div><h2 id="panelTitle" class="font-bold">Add an image</h2><p id="panelDesc" class="mt-1 text-xs leading-5 text-slate-400">Upload an image or drag it onto the canvas.</p></div><button id="closeSheet" class="hidden text-slate-400">×</button></div>
      <div id="panelBody"></div>
    </aside>
  </main>

  <template id="imagePanel"><label for="fileInput2" class="flex cursor-pointer items-center justify-center rounded-xl border border-dashed border-violet-400/40 bg-violet-500/10 px-4 py-8 text-center text-sm text-violet-200 transition hover:bg-violet-500/20">Choose a different image<input id="fileInput2" type="file" accept="image/*" class="hidden"></label><div class="mt-4 rounded-xl bg-white/[.03] p-4 text-xs leading-6 text-slate-400">Your image is processed locally using HTML5 Canvas. Nothing is uploaded to a server.</div></template>
  <template id="filtersPanel"><div class="grid grid-cols-2 gap-2" id="filterGrid"></div></template>
  <template id="adjustPanel"><div id="adjustGrid" class="space-y-4"></div><button data-action="resetAdjust" class="mt-5 w-full rounded-xl border border-white/10 py-2.5 text-sm text-slate-300 hover:bg-white/10">Reset adjustments</button></template>
  <template id="cropPanel"><div class="grid grid-cols-2 gap-2" id="cropGrid"></div><button data-action="rotate" class="mt-3 w-full rounded-xl border border-white/10 py-2.5 text-sm text-slate-300 hover:bg-white/10">↻ Rotate 90°</button><button data-action="flip" class="mt-2 w-full rounded-xl border border-white/10 py-2.5 text-sm text-slate-300 hover:bg-white/10">⇆ Flip horizontal</button></template>
  <template id="textPanel"><label class="block text-xs text-slate-400">Text<input id="textValue" class="mt-2 w-full rounded-lg border border-white/10 bg-black/20 px-3 py-2.5 text-sm text-white outline-none focus:border-violet-400" placeholder="Type something..."></label><div class="mt-3 grid grid-cols-2 gap-3"><label class="text-xs text-slate-400">Size<input id="textSize" type="range" min="12" max="180" value="56" class="mt-3 w-full"></label><label class="text-xs text-slate-400">Color<input id="textColor" type="color" value="#ffffff" class="mt-2 h-9 w-full cursor-pointer rounded"></label></div><button data-action="addText" class="mt-5 w-full rounded-xl bg-white py-2.5 text-sm font-semibold text-slate-900 hover:bg-violet-100">Add text to canvas</button><p class="mt-3 text-xs leading-5 text-slate-500">Text is permanently drawn into the canvas when added.</p></template>
  <template id="bgPanel"><h3 class="text-sm font-semibold">Background Remover</h3><p class="mt-2 text-xs leading-5 text-slate-400">A lightweight client-side remover that makes near-uniform corner colors transparent. For best results, use a subject with a simple background.</p><label class="mt-5 flex items-center gap-3 text-sm text-slate-300"><input id="bgStrength" type="range" min="8" max="70" value="30" class="w-full"><span id="bgStrengthVal">30</span></label><button data-action="removeBg" class="mt-5 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-semibold text-white hover:bg-violet-400">Remove background</button></template>

  <script>
    const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
    const canvas = $('#canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
    const state = { image: null, base64: null, tool: 'image', filter: 'original', brightness: 100, contrast: 100, saturation: 100, blur: 0, rotation: 0, flipX: false, crop: null, history: [], future: [] };
    const filters = { original: 'Original', vivid: 'Vivid', warm: 'Warm', cool: 'Cool', mono: 'Mono', vintage: 'Vintage' };
    const adjustments = [{ key: 'brightness', label: 'Brightness', min: 0, max: 200, value: 100 }, { key: 'contrast', label: 'Contrast', min: 0, max: 200, value: 100 }, { key: 'saturation', label: 'Saturation', min: 0, max: 200, value: 100 }, { key: 'blur', label: 'Blur', min: 0, max: 12, value: 0 }];

    function snapshot() { return { filter: state.filter, brightness: state.brightness, contrast: state.contrast, saturation: state.saturation, blur: state.blur, rotation: state.rotation, flipX: state.flipX, crop: state.crop ? { ...state.crop } : null, base64: state.base64 }; }
    function saveHistory() { state.history.push(snapshot()); if (state.history.length > 30) state.history.shift(); state.future = []; updateHistoryButtons(); }
    function restore(s) { Object.assign(state, s); if (s.base64) loadImage(s.base64, false); else render(); updateHistoryButtons(); }
    function updateHistoryButtons() { $('#undoBtn').disabled = !state.history.length; $('#redoBtn').disabled = !state.future.length; }
    function loadImage(src, record = true) { const img = new Image(); img.onload = () => { if (record && state.image) saveHistory(); state.image = img; state.base64 = src; state.crop = null; state.rotation = 0; state.flipX = false; $('#emptyState').classList.add('hidden'); canvas.classList.remove('hidden'); $('#fitBtn').classList.remove('hidden'); $('#imageInfo').textContent = `${img.naturalWidth} × ${img.naturalHeight}px · Saved locally`; $('#status').textContent = 'Image loaded · edits are local'; render(); }; img.src = src; }
    function openFile(file) { if (!file || !file.type.startsWith('image/')) return; const reader = new FileReader(); reader.onload = (e) => loadImage(e.target.result); reader.readAsDataURL(file); }
    function filterCss() { const f = { original: '', vivid: 'saturate(1.45) contrast(1.08)', warm: 'sepia(.18) saturate(1.25) hue-rotate(-8deg)', cool: 'saturate(1.1) hue-rotate(14deg)', mono: 'grayscale(1)', vintage: 'sepia(.38) contrast(1.08) saturate(.85)' }; return f[state.filter] || ''; }
    function render() { if (!state.image) return; const img = state.image, sw = img.naturalWidth, sh = img.naturalHeight; let crop = state.crop || { x: 0, y: 0, w: sw, h: sh }; const rotated = state.rotation % 180 !== 0; canvas.width = rotated ? crop.h : crop.w; canvas.height = rotated ? crop.w : crop.h; ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.filter = `${filterCss()} brightness(${state.brightness}%) contrast(${state.contrast}%) saturate(${state.saturation}%) blur(${state.blur}px)`; ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(state.rotation * Math.PI / 180); ctx.scale(state.flipX ? -1 : 1, 1); ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h, -crop.w / 2, -crop.h / 2, crop.w, crop.h); ctx.restore(); ctx.filter = 'none'; }
    function drawText() { if (!state.image || !$('#textValue')?.value.trim()) return; saveHistory(); const value = $('#textValue').value.trim(); const size = Number($('#textSize').value); const color = $('#textColor').value; ctx.save(); ctx.font = `700 ${size}px Inter, sans-serif`; ctx.fillStyle = color; ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = Math.max(3, size / 10); ctx.textAlign = 'center'; ctx.fillText(value, canvas.width / 2, canvas.height / 2); ctx.restore(); state.base64 = canvas.toDataURL('image/png'); state.image = null; const im = new Image(); im.onload = () => { state.image = im; render(); }; im.src = state.base64; $('#status').textContent = 'Text added to canvas'; }
    function removeBackground() { if (!state.image) return; saveHistory(); render(); const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height), data = pixels.data, strength = Number($('#bgStrength')?.value || 30), corners = [[data[0], data[1], data[2]], [data[(canvas.width - 1) * 4], data[(canvas.width - 1) * 4 + 1], data[(canvas.width - 1) * 4 + 2]]]; const bg = corners[0]; for (let i = 0; i < data.length; i += 4) { const d = Math.sqrt((data[i] - bg[0]) ** 2 + (data[i + 1] - bg[1]) ** 2 + (data[i + 2] - bg[2]) ** 2); if (d < strength * 3) data[i + 3] = 0; } ctx.putImageData(pixels, 0, 0); state.base64 = canvas.toDataURL('image/png'); const im = new Image(); im.onload = () => { state.image = im; $('#status').textContent = 'Background pixels removed'; }; im.src = state.base64; }
    function setTool(tool) { state.tool = tool; $$('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === tool)); const labels = { image: ['Add an image', 'Upload an image or drag it onto the canvas.'], filters: ['Filters', 'Give your image a new mood.'], adjust: ['Adjust', 'Tune the look with real canvas pixels.'], crop: ['Crop & transform', 'Choose a crop ratio or transform your image.'], text: ['Text', 'Draw a text layer directly onto the canvas.'], bg: ['Background remover', 'Remove simple, near-uniform backgrounds locally.'] }; $('#panelTitle').textContent = labels[tool][0]; $('#panelDesc').textContent = labels[tool][1]; const tpl = document.querySelector(`#${tool === 'bg' ? 'bg' : tool}Panel`); $('#panelBody').innerHTML = tpl.innerHTML; bindPanel(tool); if (innerWidth < 768) $('#controls').classList.add('open'); }
    function bindPanel(tool) { if (tool === 'image') $('#fileInput2').onchange = e => openFile(e.target.files[0]); if (tool === 'filters') { $('#filterGrid').innerHTML = Object.entries(filters).map(([k, v]) => `<button class="filter rounded-xl border border-white/10 px-2 py-3 text-xs text-slate-300 hover:bg-white/10 ${state.filter === k ? 'active' : ''}" data-filter="${k}">${v}</button>`).join(''); $$('.filter').forEach(b => b.onclick = () => { saveHistory(); state.filter = b.dataset.filter; render(); $$('.filter').forEach(x => x.classList.toggle('active', x === b)); }); } if (tool === 'adjust') { $('#adjustGrid').innerHTML = adjustments.map(a => `<label class="block text-xs text-slate-400"><span class="mb-2 flex justify-between"><span>${a.label}</span><span id="${a.key}Val" class="text-slate-200">${state[a.key]}${a.key === 'blur' ? 'px' : '%'}</span></span><input data-adjust="${a.key}" type="range" min="${a.min}" max="${a.max}" value="${state[a.key]}" class="w-full"></label>`).join(''); $$('[data-adjust]').forEach(input => input.oninput = () => { state[input.dataset.adjust] = Number(input.value); $(`#${input.dataset.adjust}Val`).textContent = `${input.value}${input.dataset.adjust === 'blur' ? 'px' : '%'}`; render(); }); } if (tool === 'crop') { $('#cropGrid').innerHTML = ['free', '1:1', '4:3', '16:9'].map(r => `<button class="crop-option rounded-xl border border-white/10 px-2 py-3 text-xs text-slate-300 hover:bg-white/10" data-ratio="${r}">${r === 'free' ? 'Free' : r}</button>`).join(''); $$('.crop-option').forEach(b => b.onclick = () => { if (!state.image) return; saveHistory(); const [rw, rh] = b.dataset.ratio.split(':').map(Number); const w = state.image.naturalWidth, h = state.image.naturalHeight; if (b.dataset.ratio === 'free') state.crop = { x: w * .1, y: h * .1, w: w * .8, h: h * .8 }; else { const ratio = rw / rh; let cw = w, ch = w / ratio; if (ch > h) { ch = h; cw = h * ratio; } state.crop = { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch }; } render(); }); } if (tool === 'text') { $('[data-action="addText"]').onclick = drawText; } if (tool === 'bg') { $('#bgStrength').oninput = e => $('#bgStrengthVal').textContent = e.target.value; } $$('[data-action="rotate"]').forEach(b => b.onclick = () => { saveHistory(); state.rotation = (state.rotation + 90) % 360; render(); }); $$('[data-action="flip"]').forEach(b => b.onclick = () => { saveHistory(); state.flipX = !state.flipX; render(); }); $$('[data-action="resetAdjust"]').forEach(b => b.onclick = () => { saveHistory(); state.brightness = state.contrast = state.saturation = 100; state.blur = 0; render(); setTool('adjust'); }); $$('[data-action="removeBg"]').forEach(b => b.onclick = removeBackground); }

    $('#fileInput').onchange = e => openFile(e.target.files[0]); $('#newBtn').onclick = () => { state.image = null; state.base64 = null; canvas.classList.add('hidden'); $('#emptyState').classList.remove('hidden'); $('#imageInfo').textContent = 'No image loaded'; $('#status').textContent = 'Ready to create'; }; $('#downloadBtn').onclick = () => { if (!state.image) return; const link = document.createElement('a'); link.download = 'editkaro-image.png'; link.href = canvas.toDataURL('image/png'); link.click(); }; $('#fitBtn').onclick = render;
    $('#dropZone').ondragover = e => { e.preventDefault(); $('#dropZone').classList.add('drop-active'); }; $('#dropZone').ondragleave = () => $('#dropZone').classList.remove('drop-active'); $('#dropZone').ondrop = e => { e.preventDefault(); $('#dropZone').classList.remove('drop-active'); openFile(e.dataTransfer.files[0]); };
    $$('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool)); $('#sheetHandle').onclick = () => $('#controls').classList.toggle('open'); $('#closeSheet').onclick = () => $('#controls').classList.remove('open');
    $('#undoBtn').onclick = () => { if (!state.history.length) return; state.future.push(snapshot()); restore(state.history.pop()); }; $('#redoBtn').onclick = () => { if (!state.future.length) return; state.history.push(snapshot()); restore(state.future.pop()); }; updateHistoryButtons(); setTool('image');
  </script>
</body>
</html>
