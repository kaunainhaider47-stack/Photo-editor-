<!doctype html>
<html lang="en">
<head>

<title>Canvas Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel-2:#242832;--text:#f6f7fb;--muted:#9da4b4;--accent:#9e8cff;--accent-2:#c1b7ff;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#2a2a43 0,var(--bg) 44%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(17,19,24,.72);backdrop-filter:blur(18px)}.brand{display:flex;gap:12px;align-items:center;font-weight:760}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#a694ff,#6154d7)}.top-actions,.tools,.filter-controls,.filter-actions{display:flex;align-items:center;gap:10px}.button{border:1px solid var(--border);color:var(--text);background:var(--panel-2);border-radius:10px;padding:10px 15px;transition:.2s ease}.button:hover{border-color:rgba(193,183,255,.6);transform:translateY(-1px)}.button.primary{border:0;color:#171328;background:var(--accent-2);font-weight:750}.workspace{flex:1;min-height:0;display:flex;flex-direction:column}.canvas-area{position:relative;flex:1;min-height:420px;display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden}.canvas-wrap{position:relative;max-width:min(86vw,980px);max-height:min(64vh,670px);display:flex;align-items:center;justify-content:center;border-radius:5px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35);background:#fff}#editorCanvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}.empty-state{text-align:center;color:var(--muted);padding:25px}.empty-state strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.drop-hint{position:absolute;inset:16px;border:1px dashed rgba(193,183,255,.45);border-radius:13px;display:none;align-items:center;justify-content:center;color:var(--accent-2);background:rgba(50,45,85,.18)}.canvas-area.dragging .drop-hint{display:flex}.add-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 36px));padding:27px;border:1px solid var(--border);border-radius:22px;text-align:center;background:rgba(27,30,37,.94);box-shadow:0 24px 80px rgba(0,0,0,.35)}.add-sheet h1{font-size:23px;margin:0 0 7px}.add-sheet p{margin:0 0 22px;color:var(--muted);line-height:1.5}.upload-button{display:inline-flex;padding:12px 18px;border-radius:11px;color:#171328;font-weight:750;background:var(--accent-2);cursor:pointer}.add-sheet.hidden{display:none}.editor-panel{width:100%;border-top:1px solid var(--border);background:rgba(25,28,35,.95);backdrop-filter:blur(20px)}.panel-content{max-height:0;overflow:hidden;transition:max-height .3s ease}.panel-content.open{max-height:340px;overflow:auto}.bottom-sheet{display:none;padding:18px 24px 16px}.bottom-sheet.active{display:block}.panel-header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.panel-title{font-weight:750}.range-wrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}input[type=range]{accent-color:var(--accent);width:180px}.filter-list{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 7px}.filter-option{flex:0 0 80px;border:0;background:transparent;color:var(--muted);padding:0;text-align:center}.filter-option.active{color:var(--text)}.text-actions,.text-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.text-controls{display:none;gap:14px}.text-controls.visible{display:flex}.text-control{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.text-control input[type=text],.text-control select{color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;min-width:130px}.text-control input[type=range]{width:130px}.swatches{display:flex;gap:6px;align-items:center}.swatch{width:23px;height:23px;border:2px solid transparent;border-radius:50%;padding:0}.swatch.active{border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent)}.toggle.active{background:var(--accent);color:#171328;border-color:var(--accent)}.hint{color:var(--muted);font-size:12px}.toolbar{height:94px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--border);background:#191c23}.tools{justify-content:center;width:100%;max-width:700px}.tool{min-width:82px;color:var(--muted);border:0;background:transparent;padding:12px 9px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px}.tool:hover,.tool.active{color:var(--text);background:var(--panel-2)}.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:10px;background:#f6f7fb;color:#171820;transition:.25s ease}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.topbar{height:62px;padding:0 15px}.top-actions .button:first-child{display:none}.canvas-area{min-height:350px;padding:16px}.toolbar{height:80px;overflow-x:auto;justify-content:flex-start}.tools{min-width:600px}.tool{min-width:72px;font-size:12px}.panel-header{align-items:flex-start;flex-direction:column}.bottom-sheet{padding:15px}.text-controls{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app"><header class="topbar"><div class="brand"><span class="brand-mark">✦</span><span>Canvas Editor</span></div><div class="top-actions"><button class="button" id="resetButton" type="button">Reset</button><button class="button primary" id="downloadButton" type="button">Download PNG</button></div></header><section class="workspace"><div class="canvas-area" id="canvasArea"><div class="canvas-wrap" id="canvasWrap"><canvas id="editorCanvas" aria-label="Photo editing canvas"></canvas><div class="empty-state" id="emptyState"><strong>Your canvas is ready</strong><span>Upload an image to start editing</span></div></div><div class="drop-hint">Drop image here</div><div class="add-sheet" id="addImageSheet"><h1>Add an image</h1><p>Choose a photo or drag and drop one onto the canvas to begin.</p><label class="upload-button" for="fileInput">＋ Choose image</label><input id="fileInput" type="file" accept="image/*" hidden /></div></div><section class="editor-panel"><div class="panel-content" id="panelContent"><div class="bottom-sheet active" id="filtersPanel"><div class="panel-header"><div class="panel-title">Filters</div><label class="range-wrap">Intensity <input id="intensity" type="range" min="0" max="100" value="100"><b id="intensityValue">100%</b></label></div><div class="filter-list" id="filterList"></div></div><div class="bottom-sheet" id="textPanel"><div class="panel-header"><div class="panel-title">Text</div><div class="text-actions"><button class="button primary" id="addTextButton" type="button">＋ Add Text</button><button class="button" id="cancelTextButton" type="button">Cancel</button><button class="button primary" id="applyTextButton" type="button">Apply</button></div></div><div class="text-controls" id="textControls"><label class="text-control">Text <input id="textInput" type="text" value="EditKaro"></label><label class="text-control">Size <input id="textSize" type="range" min="12" max="120" value="48"><b id="textSizeValue">48px</b></label><div class="text-control">Color <div class="swatches"><button class="swatch" data-color="#ffffff" style="background:#fff"></button><button class="swatch" data-color="#000000" style="background:#000"></button><button class="swatch" data-color="#ff4d6d" style="background:#ff4d6d"></button><button class="swatch" data-color="#ffd166" style="background:#ffd166"></button><button class="swatch" data-color="#06d6a0" style="background:#06d6a0"></button><button class="swatch" data-color="#4dabf7" style="background:#4dabf7"></button><input id="customColor" type="color" value="#ffffff"></div></div><button class="button toggle" id="boldButton" type="button">Bold</button><button class="button toggle" id="italicButton" type="button">Italic</button><label class="text-control">Font <select id="fontFamily"><option>Poppins</option><option>Serif</option><option>Mono</option><option>Handwriting</option><option>Bold</option></select></label><label class="text-control">Opacity <input id="textOpacity" type="range" min="0" max="100" value="100"><b id="textOpacityValue">100%</b></label><button class="button" id="deleteTextButton" type="button">Delete</button></div><div class="hint">Add text, then drag it directly on the canvas.</div></div></div><nav class="toolbar"><div class="tools"><button class="tool active" data-tool="filters" type="button">☷<span>Filters</span></button><button class="tool" data-tool="text" type="button">T<span>Text</span></button><button class="tool" data-tool="adjust" type="button">☷<span>Adjust</span></button></div></nav></section></section><div class="toast" id="toast" role="status"></div></main>
<script>
const state={uploadedImage:null,isImageLoaded:false},canvas=document.getElementById('editorCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),canvasArea=document.getElementById('canvasArea'),canvasWrap=document.getElementById('canvasWrap'),emptyState=document.getElementById('emptyState'),addImageSheet=document.getElementById('addImageSheet'),panelContent=document.getElementById('panelContent'),toast=document.getElementById('toast');let sourcePixels=null,selectedFilter='Original',toastTimer;const textLayers=[];let selectedTextId=null,pointerId=null,dragOffset={x:0,y:0};const $=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(255,v));function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}function transform(r,g,b,f){const x=.299*r+.587*g+.114*b;if(f==='Grayscale')return[x,x,x];if(f==='Sepia')return[r*.393+g*.769+b*.189,r*.349+g*.686+b*.168,r*.272+g*.534+b*.131];if(f==='B&W'){const y=x>138?255:0;return[y,y,y]}return[r,g,b]}function filteredPixels(data,f,a){const out=new Uint8ClampedArray(data);for(let i=0;i<out.length;i+=4){const p=transform(data[i],data[i+1],data[i+2],f);out[i]=clamp(data[i]+(p[0]-data[i])*a);out[i+1]=clamp(data[i+1]+(p[1]-data[i+1])*a);out[i+2]=clamp(data[i+2]+(p[2]-data[i+2])*a)}return out}function fontName(n){return{Poppins:'Poppins, sans-serif',Serif:'Georgia, serif',Mono:'monospace',Handwriting:'cursive',Bold:'Arial, sans-serif'}[n]||'sans-serif'}function drawText(l){ctx.save();ctx.globalAlpha=l.opacity??1;ctx.font=`${l.italic?'italic ':''}${l.bold?'bold ':''}${l.size}px ${fontName(l.font)}`;ctx.fillStyle=l.color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l.text,l.x,l.y);ctx.restore()}function render(){if(!sourcePixels)return;const p=filteredPixels(sourcePixels.data,selectedFilter,Number($('intensity').value)/100);ctx.putImageData(new ImageData(p,sourcePixels.width,sourcePixels.height),0,0);textLayers.forEach(drawText)}function textBounds(l){ctx.save();ctx.font=`${l.bold?'bold ':''}${l.size}px ${fontName(l.font)}`;const w=ctx.measureText(l.text||'EditKaro').width;ctx.restore();return{left:l.x-w/2,right:l.x+w/2,top:l.y-l.size/2-8,bottom:l.y+l.size/2+8}}function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function selectedLayer(){return textLayers.find(l=>l.id===selectedTextId)}function syncControls(){const l=selectedLayer();$('textControls').classList.toggle('visible',!!l);if(!l)return;$('textInput').value=l.text;$('textSize').value=l.size;$('textSizeValue').textContent=`${l.size}px`;$('customColor').value=l.color;$('fontFamily').value=l.font;$('textOpacity').value=Math.round((l.opacity??1)*100);$('textOpacityValue').textContent=`${$('textOpacity').value}%`;$('boldButton').classList.toggle('active',l.bold);$('italicButton').classList.toggle('active',l.italic);document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color.toLowerCase()===l.color.toLowerCase()))}function addText(){if(!state.isImageLoaded)return showToast('Add an image first.');const l={id:Date.now()+Math.random(),text:'EditKaro',x:canvas.width/2,y:canvas.height/2,size:48,color:'#ffffff',font:'Poppins',bold:false,dragging:false,opacity:1,italic:false};textLayers.push(l);selectedTextId=l.id;syncControls();render()}function openTool(n){document.querySelectorAll('.bottom-sheet').forEach(x=>x.classList.remove('active'));const p=$(`${n}Panel`);if(p){p.classList.add('active');panelContent.classList.add('open')}document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tool===n));if(n==='text')syncControls()}function finishText(apply){if(apply&&sourcePixels){render();sourcePixels=ctx.getImageData(0,0,canvas.width,canvas.height);showToast('Text applied')}else{render();showToast('Text cancelled')}textLayers.length=0;selectedTextId=null;syncControls();openTool('filters')}canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e);for(let i=textLayers.length-1;i>=0;i--){const l=textLayers[i],b=textBounds(l);if(p.x>=b.left&&p.x<=b.right&&p.y>=b.top&&p.y<=b.bottom){selectedTextId=l.id;l.dragging=true;dragOffset={x:p.x-l.x,y:p.y-l.y};pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);syncControls();render();return}}});canvas.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId)return;const l=selectedLayer();if(l?.dragging){const p=canvasPoint(e);l.x=p.x-dragOffset.x;l.y=p.y-dragOffset.y;render()}});function stop(e){const l=selectedLayer();if(l)l.dragging=false;if(pointerId===e.pointerId)pointerId=null}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);function loadFile(file){if(!file||!file.type.startsWith('image/'))return showToast('Please choose an image file.');const reader=new FileReader();reader.onload=e=>{const image=new Image();image.onload=()=>{state.uploadedImage=image;state.isImageLoaded=true;const s=Math.min(1,2400/Math.max(image.naturalWidth,image.naturalHeight));canvas.width=Math.round(image.naturalWidth*s);canvas.height=Math.round(image.naturalHeight*s);ctx.drawImage(image,0,0,canvas.width,canvas.height);sourcePixels=ctx.getImageData(0,0,canvas.width,canvas.height);emptyState.style.display='none';addImageSheet.classList.add('hidden');canvasWrap.style.aspectRatio=`${canvas.width}/${canvas.height}`;panelContent.classList.add('open');render();showToast('Image loaded')};image.src=e.target.result};reader.readAsDataURL(file)}function makePreviews(){const list=$('filterList');list.replaceChildren();['Original','Grayscale','Sepia','B&W'].forEach(n=>{const b=document.createElement('button');b.className='filter-option';b.textContent=n;b.onclick=()=>{selectedFilter=n;makePreviews();render()};b.classList.toggle('active',n===selectedFilter);list.append(b)})}$('fileInput').onchange=e=>loadFile(e.target.files[0]);['dragenter','dragover'].forEach(t=>canvasArea.addEventListener(t,e=>{e.preventDefault();canvasArea.classList.add('dragging')}));['dragleave','drop'].forEach(t=>canvasArea.addEventListener(t,e=>{e.preventDefault();canvasArea.classList.remove('dragging')}));canvasArea.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));$('intensity').oninput=()=>{$('intensityValue').textContent=`${$('intensity').value}%`;render()};document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>openTool(b.dataset.tool));$('addTextButton').onclick=addText;$('applyTextButton').onclick=()=>finishText(true);$('cancelTextButton').onclick=()=>finishText(false);function update(fn){const l=selectedLayer();if(l){fn(l);syncControls();render()}}$('textInput').oninput=e=>update(l=>l.text=e.target.value);$('textSize').oninput=e=>update(l=>l.size=Number(e.target.value));$('fontFamily').onchange=e=>update(l=>l.font=e.target.value);$('textOpacity').oninput=e=>update(l=>l.opacity=Number(e.target.value)/100);$('boldButton').onclick=()=>update(l=>l.bold=!l.bold);$('italicButton').onclick=()=>update(l=>l.italic=!l.italic);document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>update(l=>l.color=b.dataset.color));$('customColor').oninput=e=>update(l=>l.color=e.target.value);$('deleteTextButton').onclick=()=>{const i=textLayers.findIndex(l=>l.id===selectedTextId);if(i>=0)textLayers.splice(i,1);selectedTextId=textLayers.at(-1)?.id||null;syncControls();render()};$('downloadButton').onclick=()=>{if(!state.isImageLoaded)return showToast('Add an image before downloading.');const a=document.createElement('a');a.download='edited-photo.png';a.href=canvas.toDataURL('image/png');a.click()};$('resetButton').onclick=()=>{if(!sourcePixels)return;textLayers.length=0;selectedTextId=null;selectedFilter='Original';$('intensity').value=100;render();makePreviews();showToast('Edits reset')};makePreviews();openTool('filters');
</script></body></html>
