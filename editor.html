<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Photo Editor</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#1b1e25; --panel-2:#242832; --text:#f6f7fb; --muted:#9da4b4; --accent:#9e8cff; --accent-2:#c1b7ff; --border:rgba(255,255,255,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -20%,#2a2a43 0,var(--bg) 44%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; }
    .app { min-height:100vh; display:flex; flex-direction:column; }
    .topbar { height:72px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:rgba(17,19,24,.72); backdrop-filter:blur(18px); }
    .brand { display:flex; gap:12px; align-items:center; font-weight:760; letter-spacing:-.03em; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#a694ff,#6154d7); box-shadow:0 8px 24px rgba(126,103,255,.3); }
    .top-actions,.tools,.filter-controls,.filter-actions { display:flex; align-items:center; gap:10px; }
    .button { border:1px solid var(--border); color:var(--text); background:var(--panel-2); border-radius:10px; padding:10px 15px; transition:.2s ease; }
    .button:hover { border-color:rgba(193,183,255,.6); transform:translateY(-1px); }
    .button.primary { border:0; color:#171328; background:var(--accent-2); font-weight:750; }
    .workspace { flex:1; min-height:0; display:flex; flex-direction:column; }
    .canvas-area { position:relative; flex:1; min-height:420px; display:flex; align-items:center; justify-content:center; padding:32px; overflow:hidden; }
    .canvas-wrap { position:relative; max-width:min(86vw,980px); max-height:min(64vh,670px); display:flex; align-items:center; justify-content:center; border-radius:5px; box-shadow:0 24px 70px rgba(0,0,0,.35); overflow:hidden; background:#fff; }
    #editorCanvas { display:block; max-width:100%; max-height:100%; width:auto; height:auto; touch-action:none; }
    .empty-state { text-align:center; color:var(--muted); padding:25px; } .empty-state strong { display:block; color:var(--text); font-size:18px; margin-bottom:6px; }
    .drop-hint { position:absolute; inset:16px; border:1px dashed rgba(193,183,255,.45); border-radius:13px; display:none; align-items:center; justify-content:center; color:var(--accent-2); background:rgba(158,140,255,.08); }
    .canvas-area.dragging .drop-hint { display:flex; }
    .add-sheet { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(390px,calc(100% - 36px)); padding:27px; border:1px solid var(--border); border-radius:22px; text-align:center; background:rgba(27,30,37,.94); box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .add-sheet h1 { font-size:23px; margin:0 0 7px; letter-spacing:-.04em; } .add-sheet p { margin:0 0 22px; color:var(--muted); line-height:1.5; }
    .upload-button { display:inline-flex; align-items:center; gap:9px; padding:12px 18px; border-radius:11px; color:#171328; font-weight:750; background:var(--accent-2); cursor:pointer; } .add-sheet.hidden { display:none; }
    .editor-panel { width:100%; border-top:1px solid var(--border); background:rgba(25,28,35,.95); backdrop-filter:blur(20px); }
    .panel-content { max-height:0; overflow:hidden; transition:max-height .3s ease; } .panel-content.open { max-height:280px; overflow:auto; }
    .bottom-sheet { display:none; padding:18px 24px 16px; } .bottom-sheet.active { display:block; }
    .panel-header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:14px; } .panel-title { font-weight:750; }
    .range-wrap { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; } input[type=range] { accent-color:var(--accent); width:180px; }
    .filter-list { display:flex; gap:14px; overflow-x:auto; padding:2px 2px 7px; } .filter-option { flex:0 0 80px; border:0; background:transparent; color:var(--muted); padding:0; text-align:center; }
    .filter-option.active { color:var(--text); } .thumb { display:block; width:76px; height:58px; object-fit:cover; border-radius:9px; border:2px solid transparent; background:#30343f; margin-bottom:7px; } .filter-option.active .thumb { border-color:var(--accent-2); }
    .adjust-list { display:grid; gap:10px; max-width:650px; } .adjust-list .range-wrap { justify-content:space-between; } .adjust-list input { flex:1; }
    .crop-options { display:flex; gap:8px; flex-wrap:wrap; } .crop-options .button.active { background:var(--accent); color:#171328; border-color:var(--accent); }
    .crop-overlay { display:none; position:absolute; inset:8%; border:2px solid var(--accent-2); box-shadow:0 0 0 9999px rgba(0,0,0,.48); pointer-events:none; } .crop-overlay.visible { display:block; }
    .placeholder { text-align:center; padding:8px; color:var(--muted); } .placeholder strong { display:block; color:var(--text); margin-bottom:6px; }
    .toolbar { height:94px; display:flex; align-items:center; justify-content:center; border-top:1px solid var(--border); background:#191c23; } .tools { justify-content:center; width:100%; max-width:700px; gap:7px; }
    .tool { min-width:82px; color:var(--muted); border:0; background:transparent; padding:12px 9px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:7px; transition:.2s ease; } .tool:hover,.tool.active { color:var(--text); background:#6f5bd7; } .tool.active svg { color:#fff; } .tool svg { width:21px; height:21px; }
    .toast { position:fixed; left:50%; bottom:112px; transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:11px 16px; border-radius:10px; background:#f6f7fb; color:#171820; transition:.2s ease; } .toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:650px) { .topbar{height:62px;padding:0 15px}.top-actions .button:first-child{display:none}.canvas-area{min-height:350px;padding:16px}.toolbar{height:80px;overflow-x:auto;justify-content:flex-start}.tools{min-width:600px}.tool{min-width:72px;font-size:12px}.bottom-sheet{padding:15px}.panel-header{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Canvas Editor</span></div><div class="top-actions"><button class="button" id="resetButton" type="button">Reset</button><button class="button primary" id="downloadButton" type="button">Download PNG</button></div></header>
    <section class="workspace"><div class="canvas-area" id="canvasArea"><div class="canvas-wrap" id="canvasWrap"><canvas id="editorCanvas" aria-label="Photo editing canvas"></canvas><div class="empty-state" id="emptyState"><strong>Your canvas is ready</strong><span>Upload an image to start editing</span></div><div class="crop-overlay" id="cropOverlay"></div></div><div class="drop-hint">Drop image here</div><div class="add-sheet" id="addImageSheet"><h1>Add an image</h1><p>Choose a photo or drag and drop one onto the canvas to begin.</p><label class="upload-button" for="fileInput">＋ Choose image</label><input id="fileInput" type="file" accept="image/*" hidden /></div></div>
      <section class="editor-panel"><div class="panel-content" id="panelContent">
        <div class="bottom-sheet" id="filtersPanel"><div class="panel-header"><div class="panel-title">Filters</div><label class="range-wrap" for="intensity"><span>Intensity</span><input id="intensity" type="range" min="0" max="100" value="100" /><b id="intensityValue">100%</b></label></div><div class="filter-list" id="filterList" role="listbox" aria-label="Filters"></div></div>
        <div class="bottom-sheet" id="adjustPanel"><div class="panel-header"><div class="panel-title">Adjust</div><div class="filter-actions"><button class="button" id="applyAdjustButton" type="button">Apply</button><button class="button" id="resetAdjustButton" type="button">Reset</button></div></div><div class="adjust-list"><label class="range-wrap">Brightness <input id="brightness" type="range" min="-100" max="100" value="0"><b id="brightnessValue">0</b></label><label class="range-wrap">Contrast <input id="contrast" type="range" min="-100" max="100" value="0"><b id="contrastValue">0</b></label><label class="range-wrap">Saturation <input id="saturation" type="range" min="-100" max="100" value="0"><b id="saturationValue">0</b></label></div></div>
        <div class="bottom-sheet" id="cropPanel"><div class="panel-header"><div class="panel-title">Crop</div><div class="crop-options"><button class="button active" data-ratio="free" type="button">Free</button><button class="button" data-ratio="1" type="button">1:1</button><button class="button" data-ratio="1.7778" type="button">16:9</button><button class="button" data-ratio="0.75" type="button">3:4</button><button class="button primary" id="applyCropButton" type="button">Apply</button></div></div></div>
        <div class="bottom-sheet" id="textPanel"><div class="placeholder"><strong>Text</strong><span>Coming Soon</span><br><button class="button" data-close-tool type="button">OK</button></div></div><div class="bottom-sheet" id="drawPanel"><div class="placeholder"><strong>Draw</strong><span>Coming Soon</span><br><button class="button" data-close-tool type="button">OK</button></div></div><div class="bottom-sheet" id="stickersPanel"><div class="placeholder"><strong>Stickers</strong><span>Coming Soon</span><br><button class="button" data-close-tool type="button">OK</button></div></div>
      </div><nav class="toolbar" aria-label="Editing tools"><div class="tools"><button class="tool active" data-tool="filters" type="button">☷<span>Filters</span></button><button class="tool" data-tool="adjust" type="button">☷<span>Adjust</span></button><button class="tool" data-tool="crop" type="button">⌗<span>Crop</span></button><button class="tool" data-tool="text" type="button">T<span>Text</span></button><button class="tool" data-tool="draw" type="button">✎<span>Draw</span></button><button class="tool" data-tool="stickers" type="button">☺<span>Stickers</span></button></div></nav></section>
    </section><div class="toast" id="toast" role="status"></div>
  </main>
  <script>
    const state={uploadedImage:null,canvasRef:document.getElementById('editorCanvas'),isImageLoaded:false};
    const canvas=state.canvasRef,ctx=canvas.getContext('2d',{willReadFrequently:true}),canvasArea=document.getElementById('canvasArea'),canvasWrap=document.getElementById('canvasWrap'),emptyState=document.getElementById('emptyState'),sheet=document.getElementById('addImageSheet'),fileInput=document.getElementById('fileInput'),panelContent=document.getElementById('panelContent'),filterList=document.getElementById('filterList'),intensity=document.getElementById('intensity'),intensityValue=document.getElementById('intensityValue'),toast=document.getElementById('toast'),cropOverlay=document.getElementById('cropOverlay');
    const filters=['Original','Grayscale','Sepia','Vintage','B&W','Vibrant','Cool','Warm','Dramatic']; let selectedFilter='Original',sourcePixels=null,adjustments={brightness:0,contrast:0,saturation:0},toastTimer;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)} function clamp(v){return Math.max(0,Math.min(255,v))} function mix(a,b,x){return a+(b-a)*x}
    function transformPixel(r,g,b,f){const gray=.299*r+.587*g+.114*b;switch(f){case'Grayscale':return[gray,gray,gray];case'Sepia':return[r*.393+g*.769+b*.189,r*.349+g*.686+b*.168,r*.272+g*.534+b*.131];case'Vintage':return[r*1.12+18,g*.96+6,b*.76-2];case'B&W':{const x=gray>138?255:0;return[x,x,x]}case'Vibrant':{const a=(r+g+b)/3;return[a+(r-a)*1.45,a+(g-a)*1.45,a+(b-a)*1.45]}case'Cool':return[r*.92,g*1.02+3,b*1.16+8];case'Warm':return[r*1.15+7,g*1.02+2,b*.86];case'Dramatic':return[(r-128)*1.32+128,(g-128)*1.32+128,(b-128)*1.32+128];default:return[r,g,b]}}
    function renderPixels(){if(!sourcePixels)return null;const out=new Uint8ClampedArray(sourcePixels.data),amount=Number(intensity.value)/100,b=adjustments.brightness,c=adjustments.contrast,s=adjustments.saturation,contrast=(259*(c+255))/(255*(259-c));for(let i=0;i<out.length;i+=4){let[r,g,bl]=transformPixel(sourcePixels.data[i],sourcePixels.data[i+1],sourcePixels.data[i+2],selectedFilter);r=mix(sourcePixels.data[i],r,amount);g=mix(sourcePixels.data[i+1],g,amount);bl=mix(sourcePixels.data[i+2],bl,amount);const avg=.299*r+.587*g+.114*bl; r=contrast*(r-128)+128+b*2.55;g=contrast*(g-128)+128+b*2.55;bl=contrast*(bl-128)+128+b*2.55;out[i]=clamp(avg+(r-avg)*(1+s/100));out[i+1]=clamp(avg+(g-avg)*(1+s/100));out[i+2]=clamp(avg+(bl-avg)*(1+s/100))}return out}
    function render(){const pixels=renderPixels();if(pixels)ctx.putImageData(new ImageData(pixels,sourcePixels.width,sourcePixels.height),0,0)}
    function createFilterPreviews(){filterList.replaceChildren();filters.forEach(name=>{const button=document.createElement('button');button.className='filter-option';button.type='button';const preview=document.createElement('canvas');preview.className='thumb';preview.width=152;preview.height=116;button.append(preview,Object.assign(document.createElement('span'),{textContent:name}));button.onclick=()=>{selectedFilter=name;document.querySelectorAll('.filter-option').forEach(x=>x.classList.toggle('active',x===button));render()};filterList.append(button);button.classList.toggle('active',name===selectedFilter);if(sourcePixels){const temp=new ImageData(new Uint8ClampedArray(sourcePixels.data),sourcePixels.width,sourcePixels.height),tc=document.createElement('canvas');tc.width=temp.width;tc.height=temp.height;tc.getContext('2d').putImageData(temp,0,0);preview.getContext('2d').drawImage(tc,0,0,preview.width,preview.height)}})}
    function openTool(toolName){document.querySelectorAll('.bottom-sheet').forEach(panel=>panel.classList.remove('active'));panelContent.classList.add('open');const panel=document.getElementById(`${toolName}Panel`);if(panel)panel.classList.add('active');cropOverlay.classList.toggle('visible',toolName==='crop');document.querySelectorAll('.tool').forEach(button=>button.classList.toggle('active',button.dataset.tool===toolName));if(toolName==='filters')render();}
    function loadFile(file){if(!file||!file.type.startsWith('image/')){showToast('Please choose an image file.');return}const reader=new FileReader();reader.onload=e=>{const image=new Image();image.onload=()=>{state.uploadedImage=image;state.isImageLoaded=true;const scale=Math.min(1,2400/Math.max(image.naturalWidth,image.naturalHeight));canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);ctx.drawImage(image,0,0,canvas.width,canvas.height);sourcePixels=ctx.getImageData(0,0,canvas.width,canvas.height);emptyState.style.display='none';sheet.classList.add('hidden');canvasWrap.style.aspectRatio=`${canvas.width}/${canvas.height}`;createFilterPreviews();openTool('filters');render();showToast('Image loaded')};image.src=e.target.result};reader.readAsDataURL(file)}
    fileInput.onchange=e=>loadFile(e.target.files[0]);['dragenter','dragover'].forEach(t=>canvasArea.addEventListener(t,e=>{e.preventDefault();canvasArea.classList.add('dragging')}));['dragleave','drop'].forEach(t=>canvasArea.addEventListener(t,e=>{e.preventDefault();canvasArea.classList.remove('dragging')}));canvasArea.ondrop=e=>loadFile(e.dataTransfer.files[0]);
    intensity.oninput=()=>{intensityValue.textContent=`${intensity.value}%`;render()}; document.querySelectorAll('[id^="brightness"],[id^="contrast"],[id^="saturation"]').forEach(input=>input.oninput=()=>{const key=input.id;const value=input.value;adjustments[key]=Number(value);document.getElementById(`${key}Value`).textContent=value;render()});
    document.querySelectorAll('.tool').forEach(button=>button.onclick=()=>openTool(button.dataset.tool));document.querySelectorAll('[data-close-tool]').forEach(button=>button.onclick=()=>openTool('filters'));
    document.querySelectorAll('[data-ratio]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('active'));button.classList.add('active');const ratio=button.dataset.ratio;if(ratio==='free'){cropOverlay.style.aspectRatio='auto';return}cropOverlay.style.aspectRatio=ratio});
    document.getElementById('applyAdjustButton').onclick=()=>{render();showToast('Adjustments applied')};document.getElementById('resetAdjustButton').onclick=()=>{adjustments={brightness:0,contrast:0,saturation:0};['brightness','contrast','saturation'].forEach(k=>{document.getElementById(k).value=0;document.getElementById(`${k}Value`).textContent='0'});render()};
    document.getElementById('applyCropButton').onclick=()=>{if(!state.isImageLoaded)return;const r=cropOverlay.getBoundingClientRect(),c=canvas.getBoundingClientRect(),sx=Math.max(0,Math.round((r.left-c.left)*canvas.width/c.width)),sy=Math.max(0,Math.round((r.top-c.top)*canvas.height/c.height)),sw=Math.min(canvas.width-sx,Math.round(r.width*canvas.width/c.width)),sh=Math.min(canvas.height-sy,Math.round(r.height*canvas.height/c.height));if(sw&&sh){const cropped=ctx.getImageData(sx,sy,sw,sh);canvas.width=sw;canvas.height=sh;ctx.putImageData(cropped,0,0);sourcePixels=ctx.getImageData(0,0,sw,sh);canvasWrap.style.aspectRatio=`${sw}/${sh}`;createFilterPreviews();render()}openTool('filters');showToast('Crop applied')};
    document.getElementById('downloadButton').onclick=()=>{if(!state.isImageLoaded){showToast('Add an image before downloading.');return}const a=document.createElement('a');a.download='edited-photo.png';a.href=canvas.toDataURL('image/png');a.click()};document.getElementById('resetButton').onclick=()=>{if(!state.isImageLoaded)return;selectedFilter='Original';intensity.value=100;intensityValue.textContent='100%';adjustments={brightness:0,contrast:0,saturation:0};['brightness','contrast','saturation'].forEach(k=>{document.getElementById(k).value=0;document.getElementById(`${k}Value`).textContent='0'});createFilterPreviews();render();showToast('Edits reset')};
    createFilterPreviews();openTool('filters');
  </script>
</body>
</html>
