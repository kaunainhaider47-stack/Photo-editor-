<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#242832;--text:#f6f7fb;--muted:#9da4b4;--accent:#9e8cff;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.app{max-width:1200px;margin:auto;padding:18px}.topbar,.sheet-head,.top-actions,.toolbar,.panel-actions,.row{display:flex;gap:8px;align-items:center}.topbar{justify-content:space-between;margin-bottom:16px}.brand{font-size:20px;font-weight:700}.brand-mark{color:var(--accent);margin-right:8px}.button,.tool,.filter-card,.ratio{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer}.button.primary,.tool.active,.ratio.active{background:var(--accent);color:#15131e;border-color:transparent}.workspace{min-height:300px;display:grid;place-items:center;background:#0b0c0f;border-radius:12px;padding:16px;position:relative}.canvas-wrap{position:relative;max-width:100%;overflow:auto}.canvas-wrap canvas{display:block;max-width:100%;touch-action:none;background:#20232a}.canvas-wrap.checker canvas{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.empty-modal{position:absolute;text-align:center;color:var(--muted)}.hidden{display:none!important}.sheet{background:var(--panel);border-radius:12px;margin-top:14px;padding:16px}.sheet-head{justify-content:space-between}.panel{display:none}.panel.active{display:block}.filter-list,.ratio-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.filter-card{min-width:88px}.range-row{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:10px 0}.range-row input{width:100%}input[type=text],input[type=color]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px}input[type=color]{padding:2px;width:45px;height:36px}.text-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.toolbar{justify-content:center;flex-wrap:wrap;margin-top:14px}.tool{min-width:90px}.muted,.crop-help{color:var(--muted)}.bg-preview{display:flex;gap:6px;margin:12px 0}.bg-preview button.selected{background:#8b5cf6;color:#fff}.remove-button{background:#8b5cf6;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #aaa;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script type="module">
try { const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm'); window.removeBackground=removeBackground } catch(e) { console.warn('Background removal CDN unavailable; using fallback.',e) }
</script>
</head>
<body><main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span>Canvas Editor</div><div class="top-actions"><button class="button" id="resetButton">Reset</button><button class="button" id="downloadButton">Download PNG</button><label class="button">Upload<input id="imageInput" type="file" accept="image/*" hidden></label></div></header>
<section class="workspace"><div class="canvas-wrap" id="canvasWrap"><canvas id="editorCanvas"></canvas><div class="empty-modal" id="emptyModal"><h2>Add an image</h2><p>Upload a photo to start editing</p><label class="button primary">Choose image<input id="emptyInput" type="file" accept="image/*" hidden></label></div></div></section>
<section class="sheet hidden" id="sheet"><div class="sheet-head"><h3 id="sheetTitle">Filters</h3><div class="panel-actions"><button class="button" id="cancelButton">Cancel</button><button class="button primary" id="applyButton">Apply</button></div></div>
<div class="panel active" data-panel="filters"><div class="filter-list" id="filterList"></div><div class="range-row"><label>Intensity</label><input id="intensity" type="range" min="0" max="100" value="100"><output id="intensityValue">100</output></div></div>
<div class="panel" data-panel="adjust"><div class="range-row"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"><output id="brightnessValue">0</output></div><div class="range-row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"><output id="contrastValue">0</output></div><div class="range-row"><label>Saturation</label><input id="saturation" type="range" min="-100" max="100" value="0"><output id="saturationValue">0</output></div></div>
<div class="panel" data-panel="text"><button class="button primary" id="addText">＋ Add Text</button><div id="textControls" class="text-controls hidden"><input id="textInput" type="text" aria-label="Text"><label>Size <input id="fontSize" type="range" min="8" max="160" value="48"></label><output id="fontSizeValue">48</output><input id="textColor" type="color" value="#ffffff"><label><input id="boldToggle" type="checkbox"> Bold</label><button class="button" id="deleteText">Delete</button></div></div>
<div class="panel" data-panel="crop"><div class="ratio-row" id="ratioRow"></div><p class="crop-help">Drag the crop box or its handles</p></div><div class="panel" data-panel="draw"><p class="muted">Draw on the image with your pointer.</p></div>
<div class="panel" data-panel="bgremove"><div class="bg-preview"><button class="button selected" id="originalPreview">Original</button><button class="button" id="transparentPreview">Transparent</button></div><button class="remove-button" id="removeBgButton">Remove Background</button><div id="bgLoading" class="muted hidden"><span class="spinner"></span>Removing background... ~3s</div><div class="range-row"><label>Edge Smooth</label><input id="edgeSmooth" type="range" min="0" max="10" value="3"><output id="edgeSmoothValue">3</output></div><button class="button" id="restoreBgButton">Restore Original</button></div>
</section>
<nav class="toolbar"><button class="tool" data-tool="filters">◈ Filters</button><button class="tool" data-tool="bgremove">✂️ BG Remove</button><button class="tool" data-tool="adjust">☼ Adjust</button><button class="tool" data-tool="text">T Text</button><button class="tool" data-tool="crop">◫ Crop</button><button class="tool" data-tool="draw">✎ Draw</button></nav>
</main>
<script>
const canvas=document.getElementById('editorCanvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let uploadedImage=null,isImageLoaded=false,textLayers=[],cropArea=null,currentFilter='Original',intensity=100,activeTool='filters',selectedTextId=null,drag=null,strokes=[],bgRemovedImage=null,isBgRemoved=false,bgRemoveLoading=false,edgeSmooth=3;const filters=['Original','Grayscale','Sepia','B&W','Vibrant','Cool','Warm','Dramatic'],queryBg=new URLSearchParams(location.search).get('tool')==='bgremove';
function switchTool(tool){activeTool=tool;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===tool));$('sheetTitle').textContent=tool==='bgremove'?'Background Removal':tool[0].toUpperCase()+tool.slice(1);$('sheet').classList.remove('hidden');$('applyButton').classList.toggle('hidden',!['crop','bgremove'].includes(tool));if(tool==='crop'&&!cropArea)initCrop();renderCanvas()}
function fitCanvas(img){let s=Math.min(1,(innerWidth-32)/img.width,Math.max(260,innerHeight-330)/img.height);canvas.width=Math.max(1,Math.round(img.width*s));canvas.height=Math.max(1,Math.round(img.height*s))}
function loadImage(file){let img=new Image();img.onload=()=>{uploadedImage=img;bgRemovedImage=null;isBgRemoved=false;isImageLoaded=true;$('emptyModal').classList.add('hidden');fitCanvas(img);cropArea=null;strokes=[];renderCanvas();if(queryBg)switchTool('bgremove')};img.src=URL.createObjectURL(file)}
function source(){return bgRemovedImage||uploadedImage}function clamp(v){return Math.max(0,Math.min(255,v))}
function effectPixel(d){let amount=intensity/100,bri=+$('brightness').value*2.55,co=(+$('contrast').value+100)/100,s=(+$('saturation').value+100)/100;for(let i=0;i<d.data.length;i+=4){let r=d.data[i],g=d.data[i+1],b=d.data[i+2],gray=.299*r+.587*g+.114*b,or=r,og=g,ob=b;if(currentFilter==='Grayscale')r=g=b=gray;if(currentFilter==='Sepia'){r=gray*1.2+20;g=gray*1.05+8;b=gray*.8}if(currentFilter==='B&W')r=g=b=gray>128?255:0;if(currentFilter==='Vibrant'){r=(r-128)*1.35+128;g=(g-128)*1.35+128;b=(b-128)*1.35+128}if(currentFilter==='Cool')b+=30;if(currentFilter==='Warm'){r+=25;b-=15}if(currentFilter==='Dramatic')r=(r-128)*1.5+128,g=(g-128)*1.5+128,b=(b-128)*1.5+128;if(currentFilter!=='Original'){r=or+(r-or)*amount;g=og+(g-og)*amount;b=ob+(b-ob)*amount}r=((r-128)*co+128)+bri;g=((g-128)*co+128)+bri;b=((b-128)*co+128)+bri;let q=(r+g+b)/3;r=q+(r-q)*s;g=q+(g-q)*s;b=q+(b-q)*s;d.data[i]=clamp(r);d.data[i+1]=clamp(g);d.data[i+2]=clamp(b)}}
function renderCanvas(){if(!isImageLoaded||!source())return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(source(),0,0,canvas.width,canvas.height);if(!isBgRemoved||!bgRemovedImage){let p=ctx.getImageData(0,0,canvas.width,canvas.height);effectPixel(p);ctx.putImageData(p,0,0)}for(const t of textLayers){ctx.save();ctx.font=(t.bold?'bold ':'')+t.size+'px system-ui';ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore()}if(activeTool==='crop'&&cropArea)drawCropOverlay();if(activeTool==='draw')drawStrokes()}
function drawCropOverlay(){let a=cropArea;ctx.save();ctx.fillStyle='rgba(0,0,0,.52)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(a.x,a.y,a.width,a.height);ctx.fill('evenodd');ctx.strokeStyle='#fff';ctx.strokeRect(a.x,a.y,a.width,a.height);ctx.restore()}function drawStrokes(){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';for(let s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.restore()}
function initCrop(){cropArea={x:canvas.width*.2,y:canvas.height*.2,width:canvas.width*.6,height:canvas.height*.6}}function addTextLayer(){let t={id:Date.now(),text:'Your Text',x:canvas.width/2,y:100,size:48,color:'#fff',bold:false};textLayers.push(t);selectedTextId=t.id;syncText();renderCanvas()}function syncText(){let t=textLayers.find(x=>x.id===selectedTextId);$('textControls').classList.toggle('hidden',!t);if(t){$('textInput').value=t.text;$('fontSize').value=t.size;$('fontSizeValue').value=t.size;$('textColor').value=t.color;$('boldToggle').checked=t.bold}}function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
async function fallback(blob){let bmp=await createImageBitmap(blob),t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;let x=t.getContext('2d');x.drawImage(bmp,0,0,t.width,t.height);let d=x.getImageData(0,0,t.width,t.height),br=d.data[0],bg=d.data[1],bb=d.data[2],radius=edgeSmooth*2;for(let y=0;y<t.height;y++)for(let z=0;z<t.width;z++){let i=(y*t.width+z)*4;if(Math.abs(d.data[i]-br)<40&&Math.abs(d.data[i+1]-bg)<40&&Math.abs(d.data[i+2]-bb)<40){let edge=Math.min(z,t.width-1-z,y,t.height-1-y);d.data[i+3]=radius?Math.min(255,Math.round(255*Math.max(0,edge/radius))):0}}x.putImageData(d,0,0);return new Promise(r=>t.toBlob(r,'image/png'))}
async function removeBg(){if(!isImageLoaded||bgRemoveLoading)return;bgRemoveLoading=true;$('bgLoading').classList.remove('hidden');try{let blob=await new Promise(r=>canvas.toBlob(r,'image/png'));let out=window.removeBackground?await window.removeBackground(blob):await fallback(blob);let url=URL.createObjectURL(out),img=new Image();img.onload=()=>{bgRemovedImage=img;isBgRemoved=true;$('canvasWrap').classList.add('checker');renderCanvas();bgRemoveLoading=false;$('bgLoading').classList.add('hidden')};img.src=url}catch(e){console.error(e);try{let out=await fallback(await new Promise(r=>canvas.toBlob(r,'image/png'))),url=URL.createObjectURL(out),img=new Image();img.onload=()=>{bgRemovedImage=img;isBgRemoved=true;renderCanvas();bgRemoveLoading=false;$('bgLoading').classList.add('hidden')};img.src=url}catch(_){bgRemoveLoading=false;$('bgLoading').classList.add('hidden')}}}
function applyBg(){if(bgRemovedImage){uploadedImage=bgRemovedImage;isBgRemoved=true;bgRemovedImage=null}$('sheet').classList.add('hidden');renderCanvas()}function cancelBg(){bgRemovedImage=null;isBgRemoved=false;$('canvasWrap').classList.remove('checker');$('sheet').classList.add('hidden');renderCanvas()}function applyCrop(){if(!cropArea)return;let t=document.createElement('canvas');t.width=cropArea.width;t.height=cropArea.height;t.getContext('2d').drawImage(canvas,cropArea.x,cropArea.y,cropArea.width,cropArea.height,0,0,t.width,t.height);let img=new Image();img.onload=()=>{uploadedImage=img;fitCanvas(img);cropArea=null;renderCanvas()};img.src=t.toDataURL('image/png')}
filters.forEach(n=>{let b=document.createElement('button');b.className='filter-card';b.textContent=n;b.onclick=()=>{currentFilter=n;renderCanvas()};$('filterList').appendChild(b)});[['Free',null],['1:1',1],['4:5',.8],['16:9',16/9],['9:16',9/16]].forEach(([n])=>{let b=document.createElement('button');b.className='ratio';b.textContent=n;b.onclick=()=>{initCrop();renderCanvas()};$('ratioRow').appendChild(b)});
$('imageInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);$('emptyInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>switchTool(b.dataset.tool));$('removeBgButton').onclick=removeBg;$('restoreBgButton').onclick=()=>{bgRemovedImage=null;isBgRemoved=false;$('canvasWrap').classList.remove('checker');renderCanvas()};$('originalPreview').onclick=()=>{$('canvasWrap').classList.remove('checker');$('originalPreview').classList.add('selected');$('transparentPreview').classList.remove('selected')};$('transparentPreview').onclick=()=>{$('canvasWrap').classList.add('checker');$('transparentPreview').classList.add('selected');$('originalPreview').classList.remove('selected')};$('edgeSmooth').oninput=e=>{edgeSmooth=+e.target.value;$('edgeSmoothValue').value=edgeSmooth};$('applyButton').onclick=()=>activeTool==='bgremove'?applyBg():activeTool==='crop'?applyCrop():$('sheet').classList.add('hidden');$('cancelButton').onclick=()=>activeTool==='bgremove'?cancelBg():$('sheet').classList.add('hidden');$('addText').onclick=addTextLayer;$('textInput').oninput=e=>{let t=textLayers.find(x=>x.id===selectedTextId);if(t){t.text=e.target.value;renderCanvas()}};$('fontSize').oninput=e=>{let t=textLayers.find(x=>x.id===selectedTextId);if(t){t.size=+e.target.value;$('fontSizeValue').value=t.size;renderCanvas()}};$('textColor').oninput=e=>{let t=textLayers.find(x=>x.id===selectedTextId);if(t){t.color=e.target.value;renderCanvas()}};$('boldToggle').onchange=e=>{let t=textLayers.find(x=>x.id===selectedTextId);if(t){t.bold=e.target.checked;renderCanvas()}};$('deleteText').onclick=()=>{textLayers=textLayers.filter(t=>t.id!==selectedTextId);selectedTextId=null;syncText();renderCanvas()};['brightness','contrast','saturation'].forEach(k=>$(k).oninput=e=>{$(k+'Value').value=e.target.value;renderCanvas()});$('intensity').oninput=e=>{intensity=+e.target.value;$('intensityValue').value=intensity;renderCanvas()};$('downloadButton').onclick=()=>{let a=document.createElement('a');a.download='edited-image.png';a.href=canvas.toDataURL('image/png');a.click()};$('resetButton').onclick=()=>{textLayers=[];selectedTextId=null;cropArea=null;strokes=[];currentFilter='Original';intensity=100;bgRemovedImage=null;isBgRemoved=false;$('canvasWrap').classList.remove('checker');syncText();renderCanvas()};canvas.addEventListener('pointerdown',e=>{if(!isImageLoaded)return;let p=point(e);if(activeTool==='text'){let t=textLayers[textLayers.length-1];if(t){selectedTextId=t.id;drag={kind:'text',dx:p.x-t.x,dy:p.y-t.y};syncText()}}else if(activeTool==='draw'){strokes.push([p]);drag={kind:'draw'}}else if(activeTool==='crop'&&cropArea){drag={kind:'crop',x:p.x,y:p.y,area:{...cropArea}}}canvas.setPointerCapture(e.pointerId);renderCanvas()});canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);if(drag.kind==='text'){let t=textLayers.find(x=>x.id===selectedTextId);if(t){t.x=p.x-drag.dx;t.y=p.y-drag.dy}}else if(drag.kind==='draw')strokes[strokes.length-1].push(p);else if(drag.kind==='crop'){cropArea.x=Math.max(0,Math.min(canvas.width-drag.area.width,drag.area.x+p.x-drag.x));cropArea.y=Math.max(0,Math.min(canvas.height-drag.area.height,drag.area.y+p.y-drag.y))}renderCanvas()});canvas.addEventListener('pointerup',()=>drag=null);switchTool('filters');
</script></body></html>
