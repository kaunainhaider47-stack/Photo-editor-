<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#242832;--text:#f6f7fb;--muted:#9da4b4;--accent:#9e8cff;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#15171d}.brand{font-weight:800;font-size:18px;display:flex;gap:9px;align-items:center}.brand-mark{color:var(--accent);font-size:24px}.top-actions{display:flex;gap:9px}.button{padding:9px 15px;border-radius:9px;background:var(--panel2);border:1px solid var(--border)}.button.primary,.apply{background:var(--accent);color:#171323;font-weight:700}.workspace{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 18px 155px}.canvas-wrap{position:relative;max-width:100%;max-height:calc(100vh - 250px);display:flex;align-items:center;justify-content:center;background:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;box-shadow:0 15px 50px #0008;border-radius:4px;overflow:hidden}.canvas-wrap canvas{display:block;max-width:100%;max-height:calc(100vh - 250px);width:auto;height:auto}.empty-modal{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:13px;width:min(380px,calc(100% - 32px));padding:32px 22px;border:1px solid var(--border);border-radius:18px;background:#20232bd9;backdrop-filter:blur(14px);text-align:center}.empty-modal.hidden{display:none}.empty-modal h2{margin:0}.empty-modal p{color:var(--muted);margin:0}.upload{background:var(--accent);color:#171323;border-radius:9px;padding:12px 19px;font-weight:700}.sheet{position:fixed;bottom:63px;left:50%;z-index:10;transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:#1b1e25f7;border:1px solid var(--border);border-radius:18px 18px 0 0;padding:15px 18px;box-shadow:0 -10px 35px #0008}.sheet.hidden{display:none}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet-head h3{margin:0}.panel-actions{display:flex;gap:7px}.panel{display:none}.panel.active{display:block}.filter-list{display:flex;gap:9px;overflow:auto;padding-bottom:5px}.filter-card{min-width:76px;text-align:center;color:var(--muted);font-size:12px}.filter-card img{width:70px;height:54px;object-fit:cover;border-radius:7px;display:block;margin-bottom:4px;border:2px solid transparent}.filter-card.selected img{border-color:var(--accent)}.range-row{display:flex;align-items:center;gap:12px;margin:12px 0}.range-row label{min-width:90px}.range-row input{flex:1;accent-color:var(--accent)}.colors{display:flex;gap:9px;margin:10px 0}.color{height:25px;width:25px;border-radius:50%;border:2px solid transparent}.color.selected{border-color:#fff;outline:2px solid var(--accent)}.text-input{width:100%;padding:10px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px}.toggle{padding:8px 13px;border-radius:7px;background:var(--panel2)}.toggle.on{background:var(--accent);color:#171323}.placeholder{text-align:center;padding:16px 0;color:var(--muted)}.placeholder strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}.toolbar{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;justify-content:center;gap:8px;padding:8px;background:#17191f;border-top:1px solid var(--border);z-index:11}.tool{min-width:75px;padding:7px 11px;border-radius:9px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}.tool.active{background:var(--accent);color:#171323;font-weight:700}.tool span:first-child{font-size:20px}@media(max-width:520px){.tool{min-width:55px;font-size:11px}.workspace{padding-bottom:145px}.sheet{bottom:63px}.topbar{padding:0 12px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span><span>Canvas Editor</span></div><div class="top-actions"><button class="button" id="resetButton">Reset</button><button class="button primary" id="downloadButton">Download</button></div></header>
<section class="workspace"><div class="canvas-wrap"><canvas id="editorCanvas"></canvas><div class="empty-modal" id="emptyModal"><h2>Add an image</h2><p>Upload a photo to start editing.</p><label class="upload">Choose image<input id="imageInput" type="file" accept="image/*" hidden></label></div></div></section>
<section class="sheet hidden" id="sheet"><div class="sheet-head"><h3 id="sheetTitle">Filters</h3><div class="panel-actions"><button class="button" data-action="cancel">Cancel</button><button class="button apply" data-action="apply">Apply</button></div></div>
<div class="panel" data-panel="filters"><div class="filter-list" id="filterList"></div><div class="range-row"><label>Intensity <output id="intensityValue">100%</output></label><input id="intensity" type="range" min="0" max="100" value="100"></div></div>
<div class="panel" data-panel="adjust"><div class="range-row"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"><output id="brightnessValue">0</output></div><div class="range-row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"><output id="contrastValue">0</output></div><div class="range-row"><label>Saturation</label><input id="saturation" type="range" min="-100" max="100" value="0"><output id="saturationValue">0</output></div><div class="range-row"><label>Blur</label><input id="blur" type="range" min="0" max="20" value="0"><output id="blurValue">0</output></div></div>
<div class="panel" data-panel="text"><button class="button primary" id="addText">＋ Add Text</button><div class="range-row"><label>Font size</label><input id="fontSize" type="range" min="12" max="100" value="32"><output id="fontSizeValue">32</output></div><div class="colors" id="colors"></div><button class="toggle" id="boldToggle">Bold</button><input class="text-input" id="textInput" placeholder="Select text or add a layer" value=""></div>
<div class="panel" data-panel="crop"><div class="placeholder"><strong>Coming Soon</strong><span>Crop editing will be available in a future update.</span></div></div>
<div class="panel" data-panel="draw"><div class="placeholder"><strong>Coming Soon</strong><span>Drawing tools will be available in a future update.</span></div></div>
</section>
<nav class="toolbar"><button class="tool" data-tool="filters"><span>◈</span>Filters</button><button class="tool" data-tool="adjust"><span>☼</span>Adjust</button><button class="tool" data-tool="text"><span>T</span>Text</button><button class="tool" data-tool="crop"><span>⌗</span>Crop</button><button class="tool" data-tool="draw"><span>✎</span>Draw</button></nav>
</main>
<script>
const canvas=document.getElementById('editorCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),state={uploadedImage:null,isImageLoaded:false,filter:'Original',intensity:100,adjust:{brightness:0,contrast:0,saturation:0,blur:0}},filters=['Original','Grayscale','Sepia','B&W','Vibrant','Cool','Warm','Dramatic'];let textLayers=[],selectedText=null,activeTool=null,dragging=false;
const $=id=>document.getElementById(id);
function switchTool(tool){activeTool=tool;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===tool));$('sheet').classList.toggle('hidden',!state.isImageLoaded||!tool);$('sheetTitle').textContent=tool?tool[0].toUpperCase()+tool.slice(1):'Filters';if(state.isImageLoaded)renderCanvas()}
function fitCanvas(img){const maxW=Math.min(1100,innerWidth-36),maxH=Math.max(260,innerHeight-250),scale=Math.min(1,maxW/img.width,maxH/img.height);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.style.aspectRatio=canvas.width+'/'+canvas.height}
function loadImage(file){const img=new Image();img.onload=()=>{state.uploadedImage=img;state.isImageLoaded=true;$('emptyModal').classList.add('hidden');fitCanvas(img);renderCanvas()};img.src=URL.createObjectURL(file)}
function renderCanvas(){if(!state.uploadedImage)return;ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.filter=state.adjust.blur?'blur('+state.adjust.blur+'px)':'none';ctx.drawImage(state.uploadedImage,0,0,canvas.width,canvas.height);ctx.filter='none';let f=state.filter==='Grayscale'?'grayscale(1)':state.filter==='Sepia'?'sepia(1)':state.filter==='B&W'?'grayscale(1) contrast(2)':state.filter==='Vibrant'?'saturate(1.5)':state.filter==='Cool'?'hue-rotate(15deg)':state.filter==='Warm'?'sepia(.25) saturate(1.2)':state.filter==='Dramatic'?'contrast(1.5) saturate(1.2)':'';if(f){ctx.globalAlpha=state.intensity/100;ctx.filter=f;ctx.drawImage(state.uploadedImage,0,0,canvas.width,canvas.height);ctx.globalAlpha=1}textLayers.forEach(t=>{ctx.font=(t.bold?'bold ':'')+t.size+'px system-ui';ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)});ctx.restore()}
function addTextLayer(){const t={text:'Your text',x:canvas.width/2-60,y:canvas.height/2,size:+$('fontSize').value,color:document.querySelector('.color.selected')?.dataset.color||'#fff',bold:$('boldToggle').classList.contains('on')};textLayers.push(t);selectedText=t;$('textInput').value=t.text;renderCanvas()}
$('imageInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>switchTool(b.dataset.tool));$('addText').onclick=addTextLayer;$('textInput').oninput=()=>{if(selectedText){selectedText.text=$('textInput').value;renderCanvas()}};$('boldToggle').onclick=()=>{$('boldToggle').classList.toggle('on');if(selectedText){selectedText.bold=$('boldToggle').classList.contains('on');renderCanvas()}};
['brightness','contrast','saturation','blur'].forEach(k=>$(k).oninput=e=>{state.adjust[k]=+e.target.value;$(k+'Value').textContent=e.target.value;renderCanvas()});$('intensity').oninput=e=>{state.intensity=+e.target.value;$('intensityValue').textContent=e.target.value+'%';renderCanvas()};filters.forEach(name=>{const card=document.createElement('button');card.className='filter-card';card.innerHTML='<span>'+name+'</span>';card.onclick=()=>{state.filter=name;document.querySelectorAll('.filter-card').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');renderCanvas()};$('filterList').append(card)});document.querySelector('.filter-card').classList.add('selected');['#fff','#111','#ff5c8a','#65d5ff','#ffd166'].forEach(color=>{const b=document.createElement('button');b.className='color';b.dataset.color=color;b.style.background=color;b.onclick=()=>{document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(selectedText){selectedText.color=color;renderCanvas()}};$('colors').append(b)});document.querySelector('.color').classList.add('selected');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='cancel'){textLayers=[];selectedText=null}switchTool(null);if(state.isImageLoaded)renderCanvas()});$('resetButton').onclick=()=>location.reload();$('downloadButton').onclick=()=>{if(state.isImageLoaded){const a=document.createElement('a');a.download='edited-image.png';a.href=canvas.toDataURL();a.click()}};
</script>
</body></html>
