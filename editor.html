<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#242832;--text:#f6f7fb;--muted:#9da4b4;--accent:#9e8cff;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.app{max-width:1200px;margin:auto;padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:20px;font-weight:700}.brand-mark{color:var(--accent);margin-right:8px}.top-actions,.toolbar,.panel-actions,.row{display:flex;gap:8px;align-items:center}.button,.tool,.filter-card,.ratio{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer}.button.primary,.tool.active,.ratio.active{background:var(--accent);color:#15131e;border-color:transparent}.workspace{min-height:300px;display:grid;place-items:center;background:#0b0c0f;border-radius:12px;padding:16px;position:relative}.canvas-wrap{position:relative;max-width:100%;overflow:auto}.canvas-wrap canvas{display:block;max-width:100%;background:#20232a;touch-action:none}.empty-modal{position:absolute;text-align:center;color:var(--muted)}.hidden{display:none!important}.sheet{background:var(--panel);border-radius:12px;margin-top:14px;padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.panel{display:none}.panel.active{display:block}.filter-list,.ratio-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.filter-card{min-width:88px}.range-row{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:10px 0}.range-row input{width:100%}input[type=text],input[type=color]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px}input[type=color]{padding:2px;width:45px;height:36px}.text-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.toolbar{justify-content:center;flex-wrap:wrap;margin-top:14px}.tool{min-width:90px}.muted,.crop-help{color:var(--muted)}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span>Canvas Editor</div><div class="top-actions"><button class="button" id="resetButton">Reset</button><label class="button">Upload<input id="imageInput" type="file" accept="image/*" hidden></label></div></header>
<section class="workspace"><div class="canvas-wrap"><canvas id="editorCanvas"></canvas><div class="empty-modal" id="emptyModal"><h2>Add an image</h2><p>Upload a photo to start editing</p><label class="button primary">Choose image<input id="emptyInput" type="file" accept="image/*" hidden></label></div></div></section>
<section class="sheet hidden" id="sheet"><div class="sheet-head"><h3 id="sheetTitle">Filters</h3><div class="panel-actions"><button class="button" id="cancelButton">Cancel</button><button class="button primary" id="applyCropButton">Apply crop</button></div></div>
<div class="panel active" data-panel="filters"><div class="filter-list" id="filterList"></div><div class="range-row"><label>Intensity</label><input id="intensity" type="range" min="0" max="100" value="100"><output id="intensityValue">100</output></div></div>
<div class="panel" data-panel="adjust"><div class="range-row"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"><output id="brightnessValue">0</output></div><div class="range-row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"><output id="contrastValue">0</output></div><div class="range-row"><label>Saturation</label><input id="saturation" type="range" min="-100" max="100" value="0"><output id="saturationValue">0</output></div></div>
<div class="panel" data-panel="text"><button class="button primary" id="addText">＋ Add Text</button><div id="textControls" class="text-controls hidden"><input id="textInput" type="text" aria-label="Text"><label>Size <input id="fontSize" type="range" min="8" max="160" value="48"></label><output id="fontSizeValue">48</output><input id="textColor" type="color" value="#ffffff" aria-label="Text color"><label><input id="boldToggle" type="checkbox"> Bold</label><button class="button" id="deleteText">Delete</button></div></div>
<div class="panel" data-panel="crop"><div class="ratio-row" id="ratioRow"></div><p class="crop-help">Drag the crop box or its handles</p></div><div class="panel" data-panel="draw"><p class="muted">Draw on the image with your pointer.</p></div></section>
<nav class="toolbar"><button class="tool" data-tool="filters">◈ Filters</button><button class="tool" data-tool="adjust">☼ Adjust</button><button class="tool" data-tool="text">T Text</button><button class="tool" data-tool="crop">⌗ Crop</button><button class="tool" data-tool="draw">✎ Draw</button></nav></main>
<script>
const canvasRef=document.getElementById('editorCanvas'),canvas=canvasRef,ctx=canvas.getContext('2d');
let uploadedImage=null,canvasRefImage=canvasRef,isImageLoaded=false,textLayers=[],cropArea=null,currentFilter='Original',intensity=100,activeTool='filters',selectedTextId=null,drag=null,cropRatio=null,strokes=[];
const $=id=>document.getElementById(id),filters=['Original','Grayscale','Sepia','B&W','Vibrant','Cool','Warm','Dramatic'];
function switchTool(tool){activeTool=tool;drag=null;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===tool));$('sheet').classList.remove('hidden');$('sheetTitle').textContent=tool[0].toUpperCase()+tool.slice(1);$('applyCropButton').classList.toggle('hidden',tool!=='crop');updateTextControls();renderCanvas()}
function fitCanvas(img){const maxW=Math.min(1100,innerWidth-32),maxH=Math.max(260,innerHeight-330),scale=Math.min(1,maxW/img.width,maxH/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale))}
function loadImage(file){const img=new Image();img.onload=()=>{uploadedImage=img;isImageLoaded=true;$('emptyModal').classList.add('hidden');fitCanvas(img);cropArea=null;strokes=[];renderCanvas()};img.src=URL.createObjectURL(file)}
function effectPixel(data){const amount=intensity/100;for(let i=0;i<data.data.length;i+=4){let r=data.data[i],g=data.data[i+1],b=data.data[i+2],gray=.299*r+.587*g+.114*b,or=r,og=g,ob=b;if(currentFilter==='Grayscale')r=g=b=gray;else if(currentFilter==='Sepia'){r=gray*1.2+20;g=gray*1.05+8;b=gray*.8}else if(currentFilter==='B&W')r=g=b=gray>128?255:0;else if(currentFilter==='Vibrant'){r=(r-128)*1.35+128;g=(g-128)*1.35+128;b=(b-128)*1.35+128}else if(currentFilter==='Cool')b+=30;else if(currentFilter==='Warm'){r+=25;b-=15}else if(currentFilter==='Dramatic'){r=(r-128)*1.5+128;g=(g-128)*1.5+128;b=(b-128)*1.5+128}if(currentFilter!=='Original'){r=or+(r-or)*amount;g=og+(g-og)*amount;b=ob+(b-ob)*amount}const bright=+$('brightness').value*2.55;const c=(+$('contrast').value+100)/100,s=(+$('saturation').value+100)/100;r=(gray+(r-gray)*s-128)*c+128+bright;g=(gray+(g-gray)*s-128)*c+128+bright;b=(gray+(b-gray)*s-128)*c+128+bright;data.data[i]=Math.max(0,Math.min(255,r));data.data[i+1]=Math.max(0,Math.min(255,g));data.data[i+2]=Math.max(0,Math.min(255,b))}}
function renderCanvas(){if(!isImageLoaded||!uploadedImage)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(uploadedImage,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);effectPixel(pixels);ctx.putImageData(pixels,0,0);if(activeTool==='crop'&&cropArea)drawCropOverlay();for(const t of textLayers){ctx.save();ctx.font=(t.bold?'bold ':'')+t.size+'px system-ui';ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore()}if(activeTool==='draw')drawStrokes()}
function drawCropOverlay(){const a=cropArea;ctx.save();ctx.fillStyle='rgba(0,0,0,.52)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(a.x,a.y,a.width,a.height);ctx.fill('evenodd');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(a.x,a.y,a.width,a.height);for(const [x,y] of [[a.x,a.y],[a.x+a.width,a.y],[a.x,a.y+a.height],[a.x+a.width,a.y+a.height]]){ctx.fillStyle='#fff';ctx.fillRect(x-6,y-6,12,12)}ctx.restore()}
function drawStrokes(){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';for(const s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.restore()}
function addTextLayer(){const t={id:Date.now(),text:"Your Text",x:canvas.width/2,y:100,size:48,color:"#fff",bold:false};textLayers.push(t);selectedTextId=t.id;syncTextControls();renderCanvas()}
function textAt(p){for(let i=textLayers.length-1;i>=0;i--){const t=textLayers[i];ctx.font=(t.bold?'bold ':'')+t.size+'px system-ui';if(Math.hypot(p.x-(t.x+ctx.measureText(t.text).width/2),p.y-(t.y-t.size/2))<t.size)return t}return null}
function updateTextControls(){const t=textLayers.find(x=>x.id===selectedTextId);$('textControls').classList.toggle('hidden',textLayers.length===0);if(t)syncTextControls()}
function syncTextControls(){const t=textLayers.find(x=>x.id===selectedTextId)||textLayers[0];if(!t)return;selectedTextId=t.id;$('textInput').value=t.text;$('fontSize').value=t.size;$('fontSizeValue').value=t.size;$('textColor').value=t.color;$('boldToggle').checked=t.bold}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function initCrop(){if(!cropArea)cropArea={x:canvas.width*.2,y:canvas.height*.2,width:canvas.width*.6,height:canvas.height*.6};if(cropRatio)fitCropRatio()}
function fitCropRatio(){let w=cropArea.width,h=w/cropRatio;if(h>canvas.height*.8){h=canvas.height*.8;w=h*cropRatio}if(w>canvas.width*.8){w=canvas.width*.8;h=w/cropRatio}cropArea={x:(canvas.width-w)/2,y:(canvas.height-h)/2,width:w,height:h}}
function cropHit(p){const a=cropArea;if(Math.hypot(p.x-a.x,p.y-a.y)<18)return'nw';if(Math.hypot(p.x-a.x-a.width,p.y-a.y)<18)return'ne';if(Math.hypot(p.x-a.x,p.y-a.y-a.height)<18)return'sw';if(Math.hypot(p.x-a.x-a.width,p.y-a.y-a.height)<18)return'se';return p.x>a.x&&p.x<a.x+a.width&&p.y>a.y&&p.y<a.y+a.height?'move':null}
function applyCrop(){if(activeTool!=='crop'||!cropArea)return;const a=cropArea,t=document.createElement('canvas');t.width=Math.round(a.width);t.height=Math.round(a.height);t.getContext('2d').drawImage(canvas,a.x,a.y,a.width,a.height,0,0,t.width,t.height);const img=new Image();img.onload=()=>{uploadedImage=img;fitCanvas(img);cropArea=null;renderCanvas()};img.src=t.toDataURL();switchTool('filters')}
filters.forEach(name=>{const b=document.createElement('button');b.className='filter-card';b.textContent=name;b.onclick=()=>{currentFilter=name;renderCanvas()};$('filterList').appendChild(b)});
[['Free',null],['1:1',1],['4:5',.8],['16:9',16/9],['9:16',9/16]].forEach(([label,ratio])=>{const b=document.createElement('button');b.className='ratio';b.textContent=label;b.onclick=()=>{cropRatio=ratio;document.querySelectorAll('.ratio').forEach(x=>x.classList.remove('active'));b.classList.add('active');initCrop();renderCanvas()};$('ratioRow').appendChild(b)});
$('imageInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);$('emptyInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{if(b.dataset.tool==='crop')initCrop();switchTool(b.dataset.tool)});$('addText').onclick=addTextLayer;$('applyCropButton').onclick=applyCrop;$('cancelButton').onclick=()=>switchTool('filters');
['brightness','contrast','saturation'].forEach(k=>$(k).oninput=e=>{$(k+'Value').value=e.target.value;renderCanvas()});$('intensity').oninput=e=>{intensity=+e.target.value;$('intensityValue').value=intensity;renderCanvas()};
$('textInput').oninput=e=>{const t=textLayers.find(x=>x.id===selectedTextId);if(t){t.text=e.target.value;renderCanvas()}};$('fontSize').oninput=e=>{const t=textLayers.find(x=>x.id===selectedTextId);if(t){t.size=+e.target.value;$('fontSizeValue').value=t.size;renderCanvas()}};$('textColor').oninput=e=>{const t=textLayers.find(x=>x.id===selectedTextId);if(t){t.color=e.target.value;renderCanvas()}};$('boldToggle').onchange=e=>{const t=textLayers.find(x=>x.id===selectedTextId);if(t){t.bold=e.target.checked;renderCanvas()}};$('deleteText').onclick=()=>{textLayers=textLayers.filter(t=>t.id!==selectedTextId);selectedTextId=null;updateTextControls();renderCanvas()};
canvas.addEventListener('pointerdown',e=>{if(!isImageLoaded)return;const p=point(e);if(activeTool==='text'){const t=textAt(p);if(t){selectedTextId=t.id;drag={kind:'text',dx:p.x-t.x,dy:p.y-t.y};syncTextControls();canvas.setPointerCapture(e.pointerId)}else{selectedTextId=null;updateTextControls()}renderCanvas()}else if(activeTool==='crop'&&cropArea){const kind=cropHit(p);if(kind){drag={kind,start:p,area:{...cropArea}};canvas.setPointerCapture(e.pointerId)}}else if(activeTool==='draw'){strokes.push([p]);drag={kind:'draw'};canvas.setPointerCapture(e.pointerId);renderCanvas()}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);if(drag.kind==='text'){const t=textLayers.find(x=>x.id===selectedTextId);if(t){t.x=p.x-drag.dx;t.y=p.y-drag.dy}}else if(drag.kind==='draw'){strokes[strokes.length-1].push(p)}else if(activeTool==='crop'){const d=drag,dx=p.x-d.start.x,dy=p.y-d.start.y,a={...d.area};if(d.kind==='move'){a.x=Math.max(0,Math.min(canvas.width-a.width,a.x+dx));a.y=Math.max(0,Math.min(canvas.height-a.height,a.y+dy))}else{if(d.kind.includes('e'))a.width=Math.max(30,Math.min(canvas.width-a.x,a.width+dx));if(d.kind.includes('s'))a.height=Math.max(30,Math.min(canvas.height-a.y,a.height+dy));if(d.kind.includes('w')){const nx=Math.max(0,Math.min(a.x+a.width-30,p.x));a.width+=a.x-nx;a.x=nx}if(d.kind.includes('n')){const ny=Math.max(0,Math.min(a.y+a.height-30,p.y));a.height+=a.y-ny;a.y=ny}}cropArea=a}renderCanvas()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
$('resetButton').onclick=()=>{textLayers=[];selectedTextId=null;cropArea=null;strokes=[];currentFilter='Original';intensity=100;renderCanvas();updateTextControls()};switchTool('filters');
</script></body></html>
