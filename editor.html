<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EditKaro — Pixel Filters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    * { scrollbar-width: thin; scrollbar-color: #475569 transparent; }
    body { min-height: 100vh; background: #08090d; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .glass { background: rgba(17, 19, 26, .92); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(16px); }
    .filter-card { flex: 0 0 80px; width: 80px; }
    #filterPanel { transition: transform .25s ease, opacity .25s ease; }
    #filterPanel.closed { transform: translateX(110%); opacity: 0; pointer-events: none; }
    .checkerboard {
      background-color: #171923;
      background-image: linear-gradient(45deg, #252936 25%, transparent 25%), linear-gradient(-45deg, #252936 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #252936 75%), linear-gradient(-45deg, transparent 75%, #252936 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    }
    #canvas { width: auto; height: auto; max-width: 100%; max-height: min(62vh, 720px); }
    @media (max-width: 767px) {
      #filterPanel { position: fixed; z-index: 40; inset: auto 0 0; max-height: 72vh; border-radius: 24px 24px 0 0; }
      #filterPanel.closed { transform: translateY(110%); }
      #canvas { max-height: 52vh; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <header class="glass sticky top-0 z-30 flex h-16 items-center justify-between px-4 shadow-2xl md:px-6">
    <a href="index.html" class="flex items-center gap-2.5 font-bold"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-pink-500">E</span><span>EditKaro</span></a>
    <div class="flex items-center gap-2">
      <label for="fileInput" class="cursor-pointer rounded-xl bg-white px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-violet-100">Upload image</label>
      <input id="fileInput" type="file" accept="image/*" class="hidden" />
      <button id="downloadBtn" type="button" class="rounded-xl border border-white/10 px-4 py-2 text-sm hover:bg-white/10">Download</button>
    </div>
  </header>

  <main class="mx-auto grid min-h-[calc(100vh-4rem)] max-w-[1600px] md:grid-cols-[80px_minmax(0,1fr)_340px]">
    <aside class="glass order-2 flex justify-around gap-2 p-2 md:order-1 md:flex-col md:justify-start md:p-3">
      <button class="tool rounded-xl border border-transparent p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="image">▣<span class="mt-1 block">Image</span></button>
      <button id="filtersButton" class="tool active rounded-xl border border-violet-400/30 bg-violet-500/15 p-3 text-center text-xs text-violet-200 hover:bg-violet-500/25" data-tool="filters">✦<span class="mt-1 block">Filters</span></button>
    </aside>

    <section class="order-1 flex min-h-[calc(100vh-8.5rem)] flex-col p-4 md:order-2 md:p-8">
      <div class="mb-4 flex items-center justify-between"><div><p class="text-sm font-semibold text-violet-300">Canvas editor</p><h1 class="text-2xl font-bold">Make your image pop</h1></div><span id="status" class="text-xs text-slate-500">Upload an image to begin</span></div>
      <div id="dropZone" class="checkerboard relative flex min-h-[55vh] flex-1 items-center justify-center overflow-hidden rounded-3xl border border-white/10 p-4 shadow-2xl transition-colors">
        <div id="emptyState" class="rounded-2xl bg-[#11131a]/90 p-8 text-center text-slate-400"><div class="mx-auto mb-4 text-5xl">▧</div><p class="mb-4">Drop an image to start</p><label for="fileInput" class="cursor-pointer rounded-xl bg-violet-500 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-400">Choose a different image</label></div>
        <canvas id="canvas" class="hidden rounded-xl object-contain shadow-2xl"></canvas>
      </div>
      <div id="bottomSheet" class="mt-4 rounded-2xl border border-white/10 bg-[#11131a] p-4 text-center shadow-xl"><p class="mb-3 text-sm text-slate-400">Start with a photo to unlock your editing tools</p><label for="fileInput" class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-slate-900 hover:bg-violet-100">＋ Choose a different image</label></div>
      <nav id="bottomToolbar" class="hidden mt-4 grid grid-cols-3 gap-2 rounded-2xl border border-white/10 bg-[#11131a] p-2 sm:grid-cols-6" aria-label="Editing tools">
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="filters">✦<span class="mt-1 block">Filters</span></button>
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="adjust">◒<span class="mt-1 block">Adjust</span></button>
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="crop">⌗<span class="mt-1 block">Crop</span></button>
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="text">T<span class="mt-1 block">Text</span></button>
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="draw">✎<span class="mt-1 block">Draw</span></button>
        <button class="toolbar-tool rounded-xl p-3 text-center text-xs text-slate-300 hover:bg-white/10" data-tool="stickers">♢<span class="mt-1 block">Stickers</span></button>
      </nav>
    </section>

    <aside id="filterPanel" class="glass order-3 overflow-y-auto border-t-0 p-5 shadow-2xl md:rounded-none md:border-y-0 md:border-r-0">
      <div class="mb-5 flex items-center justify-between"><div><p class="text-xs font-semibold uppercase tracking-[.2em] text-violet-300">Adjust</p><h2 class="text-xl font-bold">Filters</h2></div><button id="closeFilters" type="button" class="rounded-lg px-2 py-1 text-slate-400 hover:bg-white/10">✕</button></div>
      <p class="mb-3 text-xs text-slate-400">Select a live pixel preview</p>
      <div id="filterCards" class="mb-6 flex gap-3 overflow-x-auto pb-3" aria-label="Available filters"></div>
      <div class="rounded-2xl border border-white/10 bg-white/[.03] p-4"><div class="mb-2 flex items-center justify-between"><label for="intensity" class="font-semibold">Intensity</label><output id="intensityValue" class="text-sm text-violet-300">100%</output></div><input id="intensity" type="range" min="0" max="100" value="100" class="w-full accent-violet-500" /></div>
    </aside>
  </main>
<script>
const $ = (selector) => document.querySelector(selector);
const canvasRef = $('#canvas');
const ctx = canvasRef.getContext('2d', { willReadFrequently: true });
const previewSize = 80;
const state = { uploadedImage: null, canvasRef, isImageLoaded: false, original: null, filter: 'original', intensity: 100 };
const filterDefs = {
  original: { name: 'Original', apply: (r,g,b) => [r,g,b] },
  grayscale: { name: 'Grayscale', apply: (r,g,b) => { const y=.299*r+.587*g+.114*b; return [y,y,y]; } },
  sepia: { name: 'Sepia', apply: (r,g,b) => [r*.393+g*.769+b*.189,r*.349+g*.686+b*.168,r*.272+g*.534+b*.131] },
  vintage: { name: 'Vintage', apply: (r,g,b) => { const y=.299*r+.587*g+.114*b; return [y*1.12+18,y*.92+8,y*.72]; } },
  bw: { name: 'B&W', apply: (r,g,b) => { const y=.299*r+.587*g+.114*b, v=y>145?255:0; return [v,v,v]; } },
  vibrant: { name: 'Vibrant', apply: (r,g,b) => { const y=.299*r+.587*g+.114*b; return [y+(r-y)*1.55,y+(g-y)*1.55,y+(b-y)*1.55]; } },
  cool: { name: 'Cool', apply: (r,g,b) => [r*.88,g*1.02+4,b*1.18+12] },
  warm: { name: 'Warm', apply: (r,g,b) => [r*1.14+8,g*1.03+2,b*.84] }
};
function clamp(v){ return Math.max(0,Math.min(255,v)); }
function filteredPixels(source, filterId, intensity){ const output=new ImageData(new Uint8ClampedArray(source.data),source.width,source.height), amount=intensity/100, apply=filterDefs[filterId].apply; for(let i=0;i<source.data.length;i+=4){const [r,g,b]=apply(source.data[i],source.data[i+1],source.data[i+2]); output.data[i]=clamp(source.data[i]*(1-amount)+r*amount); output.data[i+1]=clamp(source.data[i+1]*(1-amount)+g*amount); output.data[i+2]=clamp(source.data[i+2]*(1-amount)+b*amount);} return output; }
function drawCurrent(){ if(state.original) ctx.putImageData(filteredPixels(state.original,state.filter,state.intensity),0,0); }
function makePreview(source,id){ const scale=Math.min(previewSize/source.width,previewSize/source.height), w=Math.max(1,Math.round(source.width*scale)),h=Math.max(1,Math.round(source.height*scale)),small=document.createElement('canvas'); small.width=w;small.height=h; const c=small.getContext('2d'); const sourceCanvas=document.createElement('canvas');sourceCanvas.width=source.width;sourceCanvas.height=source.height;sourceCanvas.getContext('2d').putImageData(source,0,0);c.drawImage(sourceCanvas,0,0,w,h);c.putImageData(filteredPixels(c.getImageData(0,0,w,h),id,state.intensity),0,0);return small.toDataURL('image/jpeg',.86); }
function renderCards(){ const wrap=$('#filterCards');wrap.innerHTML='';Object.entries(filterDefs).forEach(([id,def])=>{const b=document.createElement('button');b.type='button';b.className=`filter-card rounded-xl border p-1 text-left ${state.filter===id?'border-violet-400 bg-violet-500/20':'border-white/10'}`;b.innerHTML=`<img class="h-[58px] w-full rounded-lg bg-black object-cover" alt="${def.name} preview"><span class="mt-1 block truncate text-[10px] text-slate-300">${def.name}</span>`;if(state.original)b.querySelector('img').src=makePreview(state.original,id);b.onclick=()=>{state.filter=id;drawCurrent();renderCards();};wrap.appendChild(b);}); }
function loadImage(file){ if(!file||!file.type.startsWith('image/'))return; const image=new Image(); image.onload=()=>{const scale=Math.min(1,1800/Math.max(image.naturalWidth,image.naturalHeight));canvasRef.width=Math.max(1,Math.round(image.naturalWidth*scale));canvasRef.height=Math.max(1,Math.round(image.naturalHeight*scale));ctx.clearRect(0,0,canvasRef.width,canvasRef.height);ctx.drawImage(image,0,0,canvasRef.width,canvasRef.height);state.uploadedImage=image;state.isImageLoaded=true;state.original=ctx.getImageData(0,0,canvasRef.width,canvasRef.height);state.filter='original';state.intensity=100;$('#intensity').value=100;$('#intensityValue').textContent='100%';canvasRef.classList.remove('hidden');$('#emptyState').classList.add('hidden');$('#bottomSheet').classList.add('hidden');$('#bottomToolbar').classList.remove('hidden');$('#status').textContent=`${canvasRef.width} × ${canvasRef.height}`;renderCards();URL.revokeObjectURL(image.src);};image.src=URL.createObjectURL(file); }
$('#fileInput').onchange=e=>{loadImage(e.target.files[0]);e.target.value='';};
$('#intensity').oninput=e=>{state.intensity=Number(e.target.value);$('#intensityValue').textContent=`${state.intensity}%`;drawCurrent();renderCards();};
$('#filtersButton').onclick=()=>$('#filterPanel').classList.remove('closed'); $('#closeFilters').onclick=()=>$('#filterPanel').classList.add('closed');
$('#dropZone').ondragover=e=>{e.preventDefault();$('#dropZone').classList.add('border-violet-400');}; $('#dropZone').ondragleave=()=>$('#dropZone').classList.remove('border-violet-400'); $('#dropZone').ondrop=e=>{e.preventDefault();$('#dropZone').classList.remove('border-violet-400');loadImage(e.dataTransfer.files[0]);};
$('#bottomToolbar').onclick=e=>{const button=e.target.closest('[data-tool]');if(button&&button.dataset.tool==='filters')$('#filterPanel').classList.remove('closed');};
$('#downloadBtn').onclick=()=>{if(!state.isImageLoaded)return;drawCurrent();const a=document.createElement('a');a.download='editkaro-image.png';a.href=canvasRef.toDataURL('image/png');a.click();};
renderCards();
</script>
</body>
</html>
