<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#242832;--text:#f6f7fb;--muted:#9da4b4;--accent:#9e8cff;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:16px}.topbar,.sheet-head,.toolbar,.panel-actions,.ratio-row{display:flex;align-items:center}.topbar{justify-content:space-between;margin-bottom:14px}.brand{font-size:18px;font-weight:700}.brand-mark{color:var(--accent);margin-right:8px}.button,.tool,.ratio-button,.filter-card{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer}.button.primary,.ratio-button.active{background:var(--accent);color:#171321;border-color:var(--accent)}.top-actions,.panel-actions{gap:8px}.workspace{display:flex;justify-content:center;min-height:300px}.canvas-wrap{position:relative;width:100%;display:flex;justify-content:center;align-items:center}.canvas-wrap canvas{display:block;max-width:100%;max-height:calc(100vh - 330px);background:#20232b;touch-action:none}.empty-modal{position:absolute;text-align:center;background:var(--panel);padding:28px;border-radius:12px}.empty-modal.hidden,.sheet.hidden,.panel:not(.active){display:none}.sheet{background:var(--panel);border-radius:14px;margin-top:14px;padding:14px}.sheet-head{justify-content:space-between}.sheet-head h3{margin:0}.panel{padding-top:12px}.toolbar{justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}.tool{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px}.tool.active{color:var(--accent)}.filter-list{display:flex;gap:8px;flex-wrap:wrap}.filter-card{min-width:90px}.range-row{display:flex;align-items:center;gap:10px;margin-top:13px}.range-row input{flex:1}.ratio-row{gap:7px;overflow:auto;padding:3px 0 10px}.ratio-button{white-space:nowrap;padding:8px 11px}.crop-help{color:var(--muted);margin:0}.upload-label{cursor:pointer}.upload-label input{display:none}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span>Canvas Editor</div><div class="top-actions"><button class="button" id="resetButton">Reset</button><label class="button upload-label">Upload<input id="imageInput" type="file" accept="image/*"></label></div></header>
<section class="workspace"><div class="canvas-wrap"><canvas id="editorCanvas" ref="canvasRef"></canvas><div class="empty-modal" id="emptyModal"><h2>Add an image</h2><p>Upload a photo to start editing.</p><label class="button primary upload-label">Choose image<input id="emptyInput" type="file" accept="image/*"></label></div></div></section>
<section class="sheet hidden" id="sheet"><div class="sheet-head"><h3 id="sheetTitle">Filters</h3><div class="panel-actions"><button class="button" data-action="cancel">Cancel</button><button class="button primary" data-action="apply">Apply</button></div></div>
<div class="panel active" data-panel="filters"><div class="filter-list" id="filterList"></div><div class="range-row"><label>Intensity</label><input id="intensity" type="range" min="0" max="100" value="100"><output id="intensityValue">100%</output></div></div>
<div class="panel" data-panel="adjust"><div class="range-row"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"><output id="brightnessValue">0</output></div><div class="range-row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"><output id="contrastValue">0</output></div></div>
<div class="panel" data-panel="text"><button class="button primary" id="addText">＋ Add Text</button></div>
<div class="panel" data-panel="crop"><div class="ratio-row" id="ratioRow"></div><p class="crop-help">Drag handles to crop</p></div>
<div class="panel" data-panel="draw"><p>Draw tool selected. Use the canvas to draw.</p></div></section>
<nav class="toolbar"><button class="tool" data-tool="filters"><span>◈</span>Filters</button><button class="tool" data-tool="adjust"><span>☼</span>Adjust</button><button class="tool" data-tool="text"><span>T</span>Text</button><button class="tool" data-tool="crop"><span>⌗</span>Crop</button><button class="tool" data-tool="draw"><span>✎</span>Draw</button></nav>
</main>
<script>
const canvasRef=document.getElementById('editorCanvas'),canvas=canvasRef,ctx=canvas.getContext('2d'),state={uploadedImage:null,isImageLoaded:false,filter:'Original',intensity:100,adjust:{brightness:0,contrast:0}},cropArea=null,cropRatio=null;let activeTool=null,drag=null;
const $=id=>document.getElementById(id),filters=['Original','Grayscale','Sepia','B&W','Vibrant','Cool','Warm','Dramatic'],ratios=[['Free',null],['1:1',1],['4:5',4/5],['16:9',16/9],['9:16',9/16],['3:2',3/2]];
function switchTool(tool){activeTool=tool;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===tool));$('sheet').classList.toggle('hidden',!state.isImageLoaded);$('sheetTitle').textContent=tool?tool[0].toUpperCase()+tool.slice(1):'Filters';if(tool==='crop'&&state.isImageLoaded)initCrop();renderCanvas()}
function fitCanvas(img){const maxW=Math.min(1100,innerWidth-32),maxH=Math.max(260,innerHeight-330),scale=Math.min(1,maxW/img.width,maxH/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.style.aspectRatio=canvas.width+'/'+canvas.height}
function loadImage(file){const img=new Image();img.onload=()=>{state.uploadedImage=img;state.isImageLoaded=true;$('emptyModal').classList.add('hidden');fitCanvas(img);cropArea=null;renderCanvas()};img.src=URL.createObjectURL(file)}
function initCrop(){if(!cropArea)cropArea={x:canvas.width*.2,y:canvas.height*.2,width:canvas.width*.6,height:canvas.height*.6};if(cropRatio)fitCropRatio()}
function fitCropRatio(){if(!cropRatio)return;let w=cropArea.width,h=w/cropRatio;if(h>canvas.height){h=canvas.height*.6;w=h*cropRatio}if(w>canvas.width){w=canvas.width*.6;h=w/cropRatio}cropArea.width=Math.min(w,canvas.width);cropArea.height=Math.min(h,canvas.height);cropArea.x=(canvas.width-w)/2;cropArea.y=(canvas.height-h)/2}
function renderCanvas(){if(!state.uploadedImage)return;ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);let f='none';if(state.filter==='Grayscale')f='grayscale(1)';if(state.filter==='Sepia')f='sepia(1)';if(state.filter==='B&W')f='grayscale(1) contrast(1.5)';if(state.filter==='Cool')f='hue-rotate(20deg) saturate(1.2)';if(state.filter==='Warm')f='sepia(.35) saturate(1.2)';if(state.filter==='Vibrant')f='saturate(1.7)';if(state.filter==='Dramatic')f='contrast(1.35)';ctx.filter=f;ctx.drawImage(state.uploadedImage,0,0,canvas.width,canvas.height);ctx.restore();if(activeTool==='crop'&&cropArea)drawCropOverlay()}
function drawCropOverlay(){const a=cropArea;ctx.save();ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(a.x,a.y,a.width,a.height);ctx.fill('evenodd');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(a.x,a.y,a.width,a.height);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(a.x+a.width*i/3,a.y);ctx.lineTo(a.x+a.width*i/3,a.y+a.height);ctx.moveTo(a.x,a.y+a.height*i/3);ctx.lineTo(a.x+a.width,a.y+a.height*i/3);ctx.stroke()}ctx.fillStyle='#fff';ctx.strokeStyle='#765ee8';ctx.lineWidth=2;[[a.x,a.y],[a.x+a.width,a.y],[a.x,a.y+a.height],[a.x+a.width,a.y+a.height]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.stroke()});ctx.restore()}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hitCrop(p){const a=cropArea,hit=18;const corners=[['nw',a.x,a.y],['ne',a.x+a.width,a.y],['sw',a.x,a.y+a.height],['se',a.x+a.width,a.y+a.height]];for(const c of corners)if(Math.hypot(p.x-c[1],p.y-c[2])<hit)return c[0];if(p.x>=a.x&&p.x<=a.x+a.width&&p.y>=a.y&&p.y<=a.y+a.height)return'move';return null}
function moveCrop(p){if(!drag)return;const a=cropArea,dx=p.x-drag.x,dy=p.y-drag.y;if(drag.kind==='move'){a.x=Math.max(0,Math.min(canvas.width-a.width,drag.area.x+dx));a.y=Math.max(0,Math.min(canvas.height-a.height,drag.area.y+dy))}else{let l=drag.area.x,t=drag.area.y,r=l+drag.area.width,b=t+drag.area.height;if(drag.kind.includes('w'))l=Math.max(0,Math.min(r-30,p.x));if(drag.kind.includes('e'))r=Math.min(canvas.width,Math.max(l+30,p.x));if(drag.kind.includes('n'))t=Math.max(0,Math.min(b-30,p.y));if(drag.kind.includes('s'))b=Math.min(canvas.height,Math.max(t+30,p.y));if(cropRatio){if(drag.kind.includes('e')||drag.kind.includes('w'))b=drag.area.y+(r-l)/cropRatio;else r=drag.area.x+(b-t)*cropRatio;if(drag.kind.includes('n'))t=b-(r-l)/cropRatio;else if(drag.kind.includes('s'))b=t+(r-l)/cropRatio}a.x=l;a.y=t;a.width=Math.max(30,r-l);a.height=Math.max(30,b-t);if(a.x+a.width>canvas.width)a.width=canvas.width-a.x;if(a.y+a.height>canvas.height)a.height=canvas.height-a.y}drag.x=p.x;drag.y=p.y;renderCanvas()}
function applyCrop(){if(activeTool!=='crop'||!cropArea)return;const a=cropArea,t=document.createElement('canvas');t.width=Math.round(a.width);t.height=Math.round(a.height);t.getContext('2d').drawImage(canvas,a.x,a.y,a.width,a.height,0,0,t.width,t.height);const img=new Image();img.onload=()=>{state.uploadedImage=img;fitCanvas(img);cropArea=null;switchTool('filters')};img.src=t.toDataURL('image/png')}
function cancelAction(){cropArea=null;switchTool('filters')}
filters.forEach(name=>{const b=document.createElement('button');b.className='filter-card';b.textContent=name;b.onclick=()=>{state.filter=name;renderCanvas()};$('filterList').appendChild(b)});ratios.forEach(([label,value])=>{const b=document.createElement('button');b.className='ratio-button';b.textContent=label;b.onclick=()=>{cropRatio=value;document.querySelectorAll('.ratio-button').forEach(x=>x.classList.remove('active'));b.classList.add('active');initCrop();renderCanvas()};$('ratioRow').appendChild(b)});
$('imageInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);$('emptyInput').onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>switchTool(b.dataset.tool));document.querySelector('[data-action="apply"]').onclick=applyCrop;document.querySelector('[data-action="cancel"]').onclick=cancelAction;$('resetButton').onclick=()=>{if(state.uploadedImage){state.filter='Original';cropArea=null;switchTool('filters')}};
canvas.addEventListener('pointerdown',e=>{if(activeTool!=='crop'||!cropArea)return;const p=point(e),kind=hitCrop(p);if(kind){canvas.setPointerCapture(e.pointerId);drag={kind,x:p.x,y:p.y,area:{...cropArea}}}});canvas.addEventListener('pointermove',e=>{if(drag)moveCrop(point(e))});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
['brightness','contrast'].forEach(k=>$(k).oninput=e=>{state.adjust[k]=+e.target.value;$(k+'Value').textContent=e.target.value;renderCanvas()});$('intensity').oninput=e=>{$('intensityValue').textContent=e.target.value+'%'};switchTool(null);
</script>
</body></html>
