<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remove your image background online for free.">
  <title>Remove Background | Remove.bg</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202f;background:#f7f9fc}*{box-sizing:border-box}body{margin:0;min-height:100vh}
    .top{height:72px;border-bottom:1px solid #e4e9f0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,64px)}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.brand span{color:#356df3}.back{color:#68758a;text-decoration:none;font-size:14px}.back:hover{color:#356df3}
    main{max-width:1100px;margin:0 auto;padding:42px 24px 80px}.heading{text-align:center}.heading h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;margin:0 0 10px}.heading p{margin:0;color:#748198}.workspace{margin:34px auto 0;max-width:900px;min-height:470px;padding:18px;border:1px solid #dfe5ee;border-radius:18px;background:#fff;box-shadow:0 20px 70px #243b6414;display:flex;flex-direction:column;gap:18px}.canvas-wrap{flex:1;min-height:370px;border-radius:11px;display:grid;place-items:center;overflow:hidden;background-color:#f2f5f9;background-image:linear-gradient(45deg,#e4e9f0 25%,transparent 25%),linear-gradient(-45deg,#e4e9f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4e9f0 75%),linear-gradient(-45deg,transparent 75%,#e4e9f0 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.canvas-wrap.empty{background:#f8fafc}.canvas-wrap img{display:block;max-width:100%;max-height:570px;object-fit:contain}.empty{color:#718096;text-align:center}.empty strong{display:block;color:#26364f;font-size:18px;margin-bottom:8px}.empty label{display:inline-block;margin-top:20px;padding:11px 18px;border:1px solid #d5ddea;border-radius:9px;background:#fff;color:#356df3;font-weight:700;cursor:pointer}.actions{display:flex;justify-content:center;gap:12px}.button{border:0;border-radius:10px;padding:13px 24px;font-size:15px;font-weight:750;cursor:pointer;transition:.2s}.primary{background:#356df3;color:#fff;box-shadow:0 8px 18px #356df32b}.primary:hover:not(:disabled){background:#2759d8}.secondary{background:#17202f;color:#fff}.button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.status{text-align:center;min-height:20px;color:#6d7a8e;font-size:13px}.spinner{width:15px;height:15px;display:inline-block;margin-right:7px;vertical-align:-3px;border:2px solid #b9cdfb;border-top-color:#356df3;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span>●</span> Remove.bg</div><a class="back" href="index.html">← New image</a></header>
  <main>
    <div class="heading"><h1>Remove background</h1><p>Get a transparent PNG in one click.</p></div>
    <section class="workspace">
      <div class="canvas-wrap empty" id="canvasWrap"><div class="empty" id="empty"><strong>Choose an image to get started</strong><span>JPG, PNG, or WebP</span><br><label for="imageInput">Upload image</label></div><img id="preview" alt="Image preview" hidden></div>
      <div class="status" id="status"></div>
      <div class="actions"><button class="button primary" id="removeButton" disabled>Remove Background</button><button class="button secondary" id="downloadButton" disabled>Download</button></div>
    </section>
    <input id="imageInput" type="file" accept="image/*" hidden>
  </main>
  <script type="module">
    import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';
    const input=document.getElementById('imageInput'), preview=document.getElementById('preview'), empty=document.getElementById('empty'), wrap=document.getElementById('canvasWrap'), removeButton=document.getElementById('removeButton'), downloadButton=document.getElementById('downloadButton'), status=document.getElementById('status');
    let sourceFile=null, resultBlob=null;
    function showImage(file){ sourceFile=file; resultBlob=null; downloadButton.disabled=true; removeButton.disabled=false; preview.src=URL.createObjectURL(file); preview.hidden=false; empty.hidden=true; wrap.classList.remove('empty'); status.textContent=''; }
    input.addEventListener('change',e=>{if(e.target.files[0]) showImage(e.target.files[0]);});
    const stored=sessionStorage.getItem('background-remover-image');
    if(stored){ fetch(stored).then(r=>r.blob()).then(b=>showImage(new File([b],'image'))).catch(()=>{}); sessionStorage.removeItem('background-remover-image'); }
    removeButton.addEventListener('click',async()=>{if(!sourceFile)return; removeButton.disabled=true; downloadButton.disabled=true; status.innerHTML='<span class="spinner"></span>Removing background…'; try{resultBlob=await removeBackground(sourceFile); preview.src=URL.createObjectURL(resultBlob); downloadButton.disabled=false; status.textContent='Background removed successfully.';}catch(error){console.error(error);status.textContent='Could not remove the background. Please try another image.';}finally{removeButton.disabled=false;}});
    downloadButton.addEventListener('click',()=>{if(!resultBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(resultBlob);a.download='background-removed.png';a.click();});
  </script>
</body>
</html>
