<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Remove image backgrounds online for free. Fast, private, and easy to use.">
  <title>Free Background Remover</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202f;background:#f7f9fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#e7f0ff 0,transparent 42%),#f7f9fc}
    .nav{max-width:1160px;margin:auto;padding:24px 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px}.brand span{color:#356df3}.nav a{color:#68758a;text-decoration:none;font-size:14px}
    main{max-width:920px;margin:54px auto 90px;padding:0 24px;text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#356df3;font-size:13px;font-weight:700;background:#e9f0ff;border-radius:999px;padding:8px 13px}.dot{width:7px;height:7px;border-radius:50%;background:#356df3}
    h1{font-size:clamp(44px,8vw,78px);line-height:1.02;letter-spacing:-.065em;margin:22px 0 18px;color:#111827}h1 span{color:#356df3}p{color:#68758a;font-size:18px;line-height:1.6;max-width:560px;margin:0 auto}
    .upload{display:inline-flex;align-items:center;gap:10px;margin-top:36px;border:0;border-radius:12px;padding:16px 27px;background:#356df3;color:white;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 12px 28px #356df333;transition:.2s}.upload:hover{background:#2759d8;transform:translateY(-2px)}.upload svg{width:20px}
    .demo{margin:64px auto 0;max-width:780px;min-height:250px;border:1px solid #e0e6ef;border-radius:20px;background:repeating-conic-gradient(#fff 0 25%,#f2f5f9 0 50%) 50%/26px 26px;display:grid;place-items:center;box-shadow:0 20px 60px #254a8512}.demo-card{background:#fff;border-radius:14px;padding:20px 30px;box-shadow:0 12px 36px #254a8520;color:#526177;font-weight:650}.demo-card strong{display:block;font-size:28px;color:#17202f;margin-bottom:5px}.privacy{font-size:13px;margin-top:18px;color:#8a96a8}
  </style>
</head>
<body>
  <nav class="nav"><div class="brand"><span>●</span> Remove.bg</div><a href="editor.html">Open editor</a></nav>
  <main>
    <div class="eyebrow"><i class="dot"></i> AI-powered background removal</div>
    <h1>Free <span>Background Remover</span></h1>
    <p>Remove image backgrounds in seconds. Upload a photo and get a clean, transparent PNG — no design skills required.</p>
    <label class="upload" for="imageInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14"/></svg>Upload image</label>
    <input id="imageInput" type="file" accept="image/*" hidden>
    <div class="demo"><div class="demo-card"><strong>✦</strong>Transparent backgrounds, effortlessly</div></div>
    <div class="privacy">Free to use · Your image stays in your browser</div>
  </main>
  <script>
    document.getElementById('imageInput').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { sessionStorage.setItem('background-remover-image', reader.result); location.href = 'editor.html'; };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
