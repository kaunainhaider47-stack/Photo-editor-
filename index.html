<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BG Remover</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0a0a;color:#fff}.app{width:min(720px,100%);margin:auto;padding:18px 16px 48px}.top{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 20px #8b5cf666}.actions{display:flex;gap:8px}button{border:1px solid #2a2a2a;border-radius:999px;background:#141414;color:#e5e7eb;padding:10px 16px;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#1e1e1e;border-color:#3a3a3a}button.primary{background:#8b5cf6;border-color:#8b5cf6;color:white;font-weight:700}.drop{min-height:440px;border:1px solid #2a2a2a;border-radius:22px;padding:16px;display:grid;place-items:center;overflow:hidden;background-color:#141414;background-image:linear-gradient(45deg,#1a1a1a 25%,transparent 25%),linear-gradient(-45deg,#1a1a1a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1a1a 75%),linear-gradient(-45deg,transparent 75%,#1a1a1a 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;box-shadow:0 20px 60px #0008}.empty{width:100%;min-height:400px;border:2px dashed #2a2a2a;border-radius:16px;display:grid;place-items:center;text-align:center;padding:32px;cursor:pointer}.empty strong{display:block;margin:12px 0 6px}.empty p{margin:0;color:#9ca3af;font-size:13px;line-height:1.6}.icon{font-size:34px}.preview{display:none;max-width:100%;max-height:65vh;border-radius:12px;box-shadow:0 12px 40px #0009}.panel{margin-top:16px;padding:18px;border:1px solid #2a2a2a;border-radius:22px;background:#141414}.panel button{width:100%;height:52px}.meta{display:flex;justify-content:space-between;color:#9ca3af;font:12px ui-monospace,monospace;margin:0 2px 10px}.compare{display:none;gap:8px;margin-top:12px}.compare button{flex:1}.status{text-align:center;color:#9ca3af;font-size:12px;min-height:20px;margin-top:12px}.private{text-align:center;color:#6b7280;font-size:11px;margin-top:18px}@media(max-width:600px){.app{padding:12px 12px 36px}.drop{min-height:360px}.empty{min-height:320px}.top .download{display:none}.top{margin-bottom:12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><span class="logo">✂️</span><span>BG Remover</span></div><div class="actions"><button class="download" id="downloadTop" hidden>⇩ Download PNG</button><button id="reset">↺ Reset</button><button class="primary" id="upload">↑ Upload</button></div></header>
    <input id="file" type="file" accept="image/*" hidden>
    <div class="meta"><span id="dimensions">No image</span><span id="badge" hidden>● Transparent</span></div>
    <section class="drop" id="drop"><div class="empty" id="empty"><div><div class="icon">🖼️</div><strong>Drop image here</strong><p>Drop an image, click Upload, or paste with Ctrl+V</p></div></div><canvas class="preview" id="canvas"></canvas></section>
    <section class="panel"><button class="primary" id="remove" disabled>✨ Remove Background</button><div class="compare" id="compare"><button id="original">Restore Original</button><button class="primary" id="download">⇩ Download Transparent PNG</button></div><div class="status" id="status"></div><div class="private">● Private — 100% on-device. No upload. No tracking.</div></section>
  </main>
<script>
(() => {
  const $ = id => document.getElementById(id), file = $('file'), canvas = $('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  let source = null, result = null, objectUrl = null, busy = false;
  const setStatus = text => $('status').textContent = text;
  function draw(image) { canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0); canvas.style.display='block'; $('empty').style.display='none'; $('remove').disabled=false; $('dimensions').textContent = `${canvas.width} × ${canvas.height}`; }
  function loadImage(blob) { if (!blob || !blob.type || !blob.type.startsWith('image/')) return; if(objectUrl) URL.revokeObjectURL(objectUrl); objectUrl=URL.createObjectURL(blob); const image=new Image(); image.onload=()=>{source=image;result=null;draw(image);$('compare').style.display='none';$('badge').hidden=true;setStatus('Ready');}; image.onerror=()=>setStatus('Could not load that image'); image.src=objectUrl; }
  function download() { if(!source) return; const link=document.createElement('a'); link.download=`bg-removed-${Date.now()}.png`; link.href=canvas.toDataURL('image/png'); link.click(); }
  async function removeBackground() { if(!source || busy) return; busy=true;$('remove').disabled=true;setStatus('Loading AI model…');try { const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm'); const remove=mod.removeBackground||mod.default; if(!remove) throw new Error('removeBackground unavailable'); setStatus('Removing background…'); const blob=await remove(await fetch(source.src).then(r=>r.blob()),{publicPath:'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/dist/',progress:(part,done,total)=>{if(total)setStatus(`Removing background… ${Math.round(done/total*100)}%`);}}); const url=URL.createObjectURL(blob); const image=new Image(); image.onload=()=>{result=image;draw(image);$('badge').hidden=false;$('compare').style.display='flex';setStatus('Background removed — transparent PNG ready');busy=false;$('remove').disabled=false;URL.revokeObjectURL(url);}; image.src=url; } catch(error) { console.error(error); setStatus('AI removal failed. Please try another image.');busy=false;$('remove').disabled=false; } }
  $('upload').onclick=()=>file.click(); $('empty').onclick=()=>file.click(); file.onchange=e=>loadImage(e.target.files[0]); $('remove').onclick=removeBackground; $('download').onclick=download; $('downloadTop').onclick=download; $('original').onclick=()=>{if(source){draw(source);$('badge').hidden=true;setStatus('Original restored');}}; $('reset').onclick=()=>{source=result=null;file.value='';canvas.style.display='none';$('empty').style.display='grid';$('compare').style.display='none';$('badge').hidden=true;$('dimensions').textContent='No image';$('remove').disabled=true;setStatus('');};
  ['dragover','dragenter'].forEach(type=>$('drop').addEventListener(type,e=>{e.preventDefault();})); $('drop').addEventListener('drop',e=>{e.preventDefault();loadImage(e.dataTransfer.files[0]);}); document.addEventListener('paste',e=>{const image=[...e.clipboardData.items].find(item=>item.type.startsWith('image/'));if(image)loadImage(image.getAsFile());});
})();
</script>
</body>
</html>
